# F7-15 (ADR-008): clamd del stack. Sustituye al de la imagen (sus valores, más los de abajo).
LogTime yes
LogFile /var/log/clamav/clamd.log
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
# Por encima de un tope (tamaño, recursión, archivos de un comprimido) no hay `OK`: se marca como
# `Heuristics.Limits.Exceeded…`, que el CRM trata como INFECTED.
AlertExceedsMax yes
# Mayor que el mayor medio que se escanea (`scan.CAP`, 16 MiB).
StreamMaxLength 32M
