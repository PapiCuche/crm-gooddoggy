# F7-15 (ADR-008): clamd del stack. Sustituye al de la imagen (sus valores, más los de abajo).
LogTime yes
LogFile /var/log/clamav/clamd.log
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
# Pasar la recursión o el anidamiento máximos (y otros topes de escaneo) da
# `Heuristics.Limits.Exceeded…`, que el CRM trata como INFECTED. Un miembro de un comprimido
# demasiado grande no siempre lo da: puede saltarse sin alerta.
AlertExceedsMax yes
# Recarga las firmas que `freshclam` (otro contenedor) deja en el volumen (valor por omisión).
SelfCheck 600
# Mayor que el mayor medio que se escanea (`scan.CAP`, 16 MiB).
StreamMaxLength 32M
