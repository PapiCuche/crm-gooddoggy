name: infra-prod

# F1-13: valida infra/prod (ADR-033) sin servidor ni secretos: shellcheck, `docker compose config`
# con valores ficticios (solo el proxy publica 80 y 443) y `caddy validate` con la imagen del borde.
# F1-15: la prueba de deploy.sh con docker falso (fallo de la puerta → vuelta atrás) y la frontera
# de images.yml (test_workflow_security.py), que el check trusted solo ejecuta desde main.
# F1-16: la retención de los backups y el simulacro de backup y restauración con un Garage local;
# también cuando cambia una migración del backend (F1-16b).
# F1-17: smoke.sh con docker y curl falsos (certificado, /demo y /health/* desde fuera).
# F1-15b: también cuando cambia un Dockerfile: validate.sh exige sus bases por digest.
# F1-20b: el verificador de atestaciones con una web y un gh falsos (sin red ni credenciales).
# F1-20d: cd-preflight.sh (condiciones que bloquean un despliegue) con un servidor simulado.
# F1-20c: release.yml (frontera) y release_record.py con un repositorio git temporal, sin red.
# Ejecuta código del PR: `pull_request` (nunca `pull_request_target`), solo lectura, acciones por SHA.
on:
  pull_request:
    paths: &paths
      - "infra/prod/**"
      - ".github/workflows/infra-prod.yml"
      - ".github/workflows/images.yml"
      - ".github/workflows/images-pr.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/release_record.py"
      - ".github/scripts/test_release_record.py"
      - "**/Dockerfile*"
      - ".github/scripts/test_workflow_security.py"
      - ".github/scripts/test_backup_retention.py"
      - ".github/scripts/test_verify_attestations.py"
      - "backend/**/migrations/**" # el simulacro restaura y comprueba migrations_at_head
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: infra-prod-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: infra-prod validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x infra/prod/*.sh infra/prod/postgres/*.sh infra/prod/backup/*.sh
      - name: deploy.sh (test-deploy.sh, sin servidor)
        run: bash infra/prod/test-deploy.sh
      - name: Modo del servidor (test-host-mode.sh, ADR-046)
        run: sh infra/prod/test-host-mode.sh
      - name: Condiciones que bloquean un despliegue (test-cd-preflight.sh, ADR-048 §7)
        run: bash infra/prod/test-cd-preflight.sh
      - name: Frontera de los workflows (images.yml incluido)
        working-directory: .github/scripts
        run: python3 -m unittest -q test_workflow_security
      - name: Verificador de atestaciones (verify_attestations.py, sin red, F1-20b)
        working-directory: .github/scripts
        run: python3 -m unittest -q test_verify_attestations
      - name: Preparar y registrar un release (release_record.py, sin red, F1-20c)
        working-directory: .github/scripts
        run: python3 -m unittest -q test_release_record
      - name: Retención de los backups (lifecycle.json y prefijos)
        working-directory: .github/scripts
        run: python3 -m unittest -q test_backup_retention
      - name: Prueba de humo sin servidor (test-smoke.sh)
        run: bash infra/prod/test-smoke.sh
      - name: Compose y Caddyfile (validate.sh --caddy)
        run: sh infra/prod/validate.sh --caddy

  drill:
    name: infra-prod backup drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: age y rclone (paquetes de Ubuntu, como en el servidor)
        run: sudo apt-get update -q && sudo apt-get install -y -q age rclone
      - name: Imagen del backend
        run: docker build -q -t crm-drill-backend:ci backend
      - name: Simulacro (backup cifrado → servidor nuevo → restauración → comprobaciones)
        env:
          BACKEND_IMAGE: crm-drill-backend:ci
        run: bash infra/prod/backup/drill.sh
