name: images

# F1-15 (ADR-033 §7): cada push a main construye las imágenes del backend, del frontend y del proxy
# (Caddy con caddy-ratelimit), las prueba, revisa que su configuración y su historial no lleven
# secretos y las publica en GHCR con la etiqueta del SHA, la procedencia y el SBOM. El resumen del
# job deja los digests como un release.env para infra/prod/deploy.sh. Hoy rige el GO exacto por SHA
# (ADR-048, fase 0): una persona despliega por SSH (ADR-033 §6.2: CI no tiene secretos de producción
# ni acceso al servidor). release.yml (F1-20c, inerte hasta que el propietario lo habilite) solo
# prepara el release y registra su aprobación; lee el release.env del artefacto `release-env` de este run.
# Por qué en main y no en una etiqueta de versión: cada SHA de main ya pasó los checks requeridos
# del PR, y así cualquier commit fusionado se puede desplegar o servir de vuelta atrás.
# Frontera (test_workflow_security.py): solo `push` a main, nunca PRs (ni de forks); `packages:
# write` solo en este job; sin más secreto que GITHUB_TOKEN; acciones y BuildKit fijados por digest.
# F1-15b: los PR construyen y prueban lo mismo (build-images.sh) en images-pr.yml, sin credenciales;
# aquí solo se publica una imagen cuya configuración es la de la probada, y release.env lleva REVISION.
# F1-20b (ADR-048 §7): el job `attest` firma una atestación de procedencia (SLSA v1, Sigstore) por imagen
# propia, solo para push a main y con `id-token`/`attestations: write` solo en ese job. No hace checkout
# ni ejecuta código del repositorio, y no toca ni reetiqueta las imágenes. Si falla, las imágenes quedan
# publicadas sin atestación y infra/prod/verify_attestations.py bloquea ese release.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Las de terceros también por digest en el release.env (ADR-033 §7): las del stack local.
  POSTGRES_REF: postgres:18.6
  REDIS_REF: redis:8.8.3-alpine

jobs:
  publish:
    name: images publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # solo aquí: publicar en ghcr.io/<owner>/<repo>/*
    outputs: # para attest, escritos solo tras validar release.env
      repo: ${{ steps.push.outputs.repo }}
      backend: ${{ steps.push.outputs.backend }}
      frontend: ${{ steps.push.outputs.frontend }}
      proxy: ${{ steps.push.outputs.proxy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: BuildKit fijado por digest
        run: docker buildx create --name crm-images --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: Instalar gitleaks (versión fijada y verificada)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Construir sin publicar, probar y revisar los metadatos (lo mismo que images-pr.yml)
        run: bash infra/prod/build-images.sh "$RUNNER_TEMP/tested" "$RUNNER_TEMP/gitleaks"
      - name: Publicar en GHCR (etiqueta del SHA, procedencia y SBOM) y anotar los digests
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          release="$RUNNER_TEMP/release.env"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          trap 'docker logout ghcr.io > /dev/null' EXIT
          # Las capas salen de la caché del builder (sin --pull: las bases van por digest). F1-15b: no se da
          # por hecho; la configuración de lo subido (capas, ENV, etiquetas, historial) tiene que ser la
          # de la imagen probada, o no hay release.env.
          config() { # <ref@digest>: digest de la configuración linux/amd64 en el registro
            local raw manifest
            raw=$(docker buildx imagetools inspect --raw "$1")
            manifest=$(python3 -c 'import json, sys; d = json.load(sys.stdin); print(next((m["digest"] for m in d.get("manifests", []) if m.get("platform", {}).get("architecture") == "amd64"), ""))' <<< "$raw")
            [ -z "$manifest" ] || raw=$(docker buildx imagetools inspect --raw "${1%@*}@$manifest")
            python3 -c 'import json, sys; print(json.load(sys.stdin)["config"]["digest"])' <<< "$raw"
          }
          for name in backend frontend proxy; do
            context=$name; [ "$name" = proxy ] && context=infra/prod/caddy
            docker buildx build --builder crm-images --platform linux/amd64 --push \
              --provenance=mode=max --sbom="generator=$SBOM_GENERATOR" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$RUNNER_TEMP/$name.json" -t "$repo/$name:$GITHUB_SHA" "$context"
            digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/$name.json")
            pushed=$(config "$repo/$name@$digest")
            tested=$(cat "$RUNNER_TEMP/tested/$name.config")
            [ "$pushed" = "$tested" ] || { echo "::error::$name: se subió la configuración $pushed y se probó $tested"; exit 1; }
            echo "${name^^}_IMAGE=$repo/$name@$digest" >> "$release"
            echo "$name=$digest" >> "$RUNNER_TEMP/digests"
          done
          for ref in "$POSTGRES_REF" "$REDIS_REF"; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            image=${ref%%:*}
            echo "${image^^}_IMAGE=docker.io/library/$ref@$digest" >> "$release"
          done
          echo "REVISION=$GITHUB_SHA" >> "$release" # deploy.sh exige el checkout de infra/prod en este commit
          grep -cE '^[A-Z]+_IMAGE=[a-z0-9./:-]+@sha256:[0-9a-f]{64}$' "$release" | grep -qx 5
          grep -qxE 'REVISION=[0-9a-f]{40}' "$release"
          { echo "repo=$repo"; cat "$RUNNER_TEMP/digests"; } >> "$GITHUB_OUTPUT"
          docker logout ghcr.io > /dev/null
          # ADR-033 decisión 8: públicas. Sin sesión, la primera vez avisa si el paquete sigue privado.
          for name in backend frontend proxy; do
            docker buildx imagetools inspect "$repo/$name:$GITHUB_SHA" > /dev/null 2>&1 ||
              echo "::warning::$repo/$name no se descarga sin credencial: hazlo público en la configuración del paquete"
          done
          { echo "## release.env de $GITHUB_SHA"; echo; echo '```'; cat "$release"; echo '```'
            echo; echo "Despliegue: \`sudo infra/prod/deploy.sh <este release.env>\` (infra/prod/README.md)."; } >> "$GITHUB_STEP_SUMMARY"
      - name: release.env como artefacto (solo digests y REVISION; release.yml lo lee por el id de este run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-env
          path: ${{ runner.temp }}/release.env
          if-no-files-found: error
          retention-days: 30

  attest:
    name: images attest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # solo aquí: el certificado de Sigstore que firma
      attestations: write # solo aquí: guardar la atestación en GitHub, no en el registro
    steps:
      - name: Atestar backend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.repo }}/backend
          subject-digest: ${{ needs.publish.outputs.backend }}
      - name: Atestar frontend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.repo }}/frontend
          subject-digest: ${{ needs.publish.outputs.frontend }}
      - name: Atestar proxy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.repo }}/proxy
          subject-digest: ${{ needs.publish.outputs.proxy }}
