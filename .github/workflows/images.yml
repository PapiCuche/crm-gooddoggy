name: images

# F1-15 (ADR-033 §7): cada push a main construye las imágenes del backend, del frontend y del proxy
# (Caddy con caddy-ratelimit), las prueba, revisa que su configuración y su historial no lleven
# secretos y las publica en GHCR con la etiqueta del SHA, la procedencia y el SBOM. El resumen del
# job deja los digests como un release.env para infra/prod/deploy.sh. El despliegue lo lanza una
# persona (ADR-033 §6.2: CI no tiene secretos de producción ni acceso al servidor).
# Por qué en main y no en una etiqueta de versión: cada SHA de main ya pasó los checks requeridos
# del PR, y así cualquier commit fusionado se puede desplegar o servir de vuelta atrás.
# Frontera (test_workflow_security.py): solo `push` a main, nunca PRs (ni de forks); `packages:
# write` solo en este job; sin más secreto que GITHUB_TOKEN; acciones y BuildKit fijados por digest.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Las de terceros también por digest en el release.env (ADR-033 §7): las del stack local.
  POSTGRES_REF: postgres:18.6
  REDIS_REF: redis:8.8.3-alpine

jobs:
  publish:
    name: images publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # solo aquí: publicar en ghcr.io/<owner>/<repo>/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: BuildKit fijado por digest
        run: docker buildx create --name crm-images --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: Instalar gitleaks (versión fijada y verificada)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Construir sin publicar, probar y revisar los metadatos
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meta"
          for name in backend frontend proxy; do
            context=$name; [ "$name" = proxy ] && context=infra/prod/caddy
            docker buildx build --builder crm-images --platform linux/amd64 --pull --load \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "crm-$name:ci" "$context"
            # Ningún secreto en la configuración (ENV, ARG, etiquetas) ni en el historial de capas.
            { docker image inspect --format '{{json .Config}}' "crm-$name:ci"
              docker history --no-trunc --format '{{.CreatedBy}}' "crm-$name:ci"; } > "$RUNNER_TEMP/meta/$name.txt"
          done
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 "$RUNNER_TEMP/meta"
          test "$(docker run --rm --entrypoint id crm-backend:ci -u)" = 10001
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
          SECRETS_KEKS="1:$(python3 -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" \
            sh infra/docker/smoke-image.sh crm-backend:ci 8000 /health/live \
            -e DJANGO_SECRET_KEY -e SECRETS_KEKS -e DJANGO_ALLOWED_HOSTS=app.example.com \
            -e FORWARDED_ALLOW_IPS=127.0.0.1 -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci
          test "$(docker run --rm --entrypoint id crm-frontend:ci -u)" != 0
          sh infra/docker/smoke-image.sh crm-frontend:ci 3000 /o/ci
          docker run --rm crm-proxy:ci caddy list-modules | grep -qx http.handlers.rate_limit
          docker run --rm -e CRM_DOMAIN=example.invalid -v "$PWD/infra/prod/Caddyfile:/etc/caddy/Caddyfile:ro" \
            crm-proxy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Publicar en GHCR (etiqueta del SHA, procedencia y SBOM) y anotar los digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          release="$RUNNER_TEMP/release.env"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          trap 'docker logout ghcr.io > /dev/null' EXIT
          # Las capas salen de la caché del builder: es lo que se acaba de probar, con las mismas etiquetas.
          for name in backend frontend proxy; do
            context=$name; [ "$name" = proxy ] && context=infra/prod/caddy
            docker buildx build --builder crm-images --platform linux/amd64 --push \
              --provenance=mode=max --sbom="generator=$SBOM_GENERATOR" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$RUNNER_TEMP/$name.json" -t "$repo/$name:$GITHUB_SHA" "$context"
            digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/$name.json")
            echo "${name^^}_IMAGE=$repo/$name@$digest" >> "$release"
          done
          for ref in "$POSTGRES_REF" "$REDIS_REF"; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            image=${ref%%:*}
            echo "${image^^}_IMAGE=docker.io/library/$ref@$digest" >> "$release"
          done
          grep -cE '^[A-Z]+_IMAGE=[a-z0-9./:-]+@sha256:[0-9a-f]{64}$' "$release" | grep -qx 5
          docker logout ghcr.io > /dev/null
          # ADR-033 decisión 8: públicas. Sin sesión, la primera vez avisa si el paquete sigue privado.
          for name in backend frontend proxy; do
            docker buildx imagetools inspect "$repo/$name:$GITHUB_SHA" > /dev/null 2>&1 ||
              echo "::warning::$repo/$name no se descarga sin credencial: hazlo público en la configuración del paquete"
          done
          { echo "## release.env de $GITHUB_SHA"; echo; echo '```'; cat "$release"; echo '```'
            echo; echo "Despliegue: \`sudo infra/prod/deploy.sh <este release.env>\` (infra/prod/README.md)."; } >> "$GITHUB_STEP_SUMMARY"
