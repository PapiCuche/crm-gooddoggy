name: frontend

# F1-09: CI del frontend (docs/architecture/ci-pipeline.md §3). Ejecuta código del PR, así que
# usa `pull_request` (nunca `pull_request_target`), permisos de solo lectura y acciones por SHA.
on:
  pull_request:
    paths: &paths
      - "frontend/**"
      - "backend/openapi/schema.yaml" # el cliente generado depende del contrato
      - ".nvmrc"
      - ".github/workflows/frontend.yml"
      - "infra/docker/smoke-image.sh" # la prueba de humo de la imagen
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm (versión de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: Node.js (versión de .nvmrc, ADR-012)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Dependencias (lockfile congelado; scripts de instalación denegados)
        run: pnpm install --frozen-lockfile
      - name: Formato (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Tipos (tsc)
        run: pnpm typecheck
      - name: Tests (Vitest)
        run: pnpm test --run
      - name: Cliente API reproducible desde backend/openapi/schema.yaml (orval)
        run: |
          pnpm api:generate
          git diff --exit-code -- src/lib/api
          test -z "$(git status --porcelain -- src/lib/api)"
      - name: Build (Next.js)
        run: pnpm build
      - name: Dependencias vulnerables (pnpm audit)
        run: pnpm audit --prod --audit-level=high
      - name: docker build (sin push) + smoke como usuario no root (F1-10)
        run: |
          set -euo pipefail
          docker build --pull -t crm-frontend:ci .
          test "$(docker run --rm --entrypoint id crm-frontend:ci -u)" != "0"
          sh ../infra/docker/smoke-image.sh crm-frontend:ci 3000 /o/ci
        env:
          # F2-07: cabeceras de seguridad de la imagen y nonce de la CSP en cada script del HTML.
          SMOKE_CHECK: node scripts/check-security-headers.mjs
