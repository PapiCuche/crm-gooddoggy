  /api/v1/o/{org_slug}/quotes/:
    get:
      operationId: quotes_list
      description: 'Las cotizaciones dentro del alcance de `quotes.view` (las que
        creó quien consulta; con alcance de equipo, también las de sus compañeros),
        paginadas por creación (ADR-016). Los filtros se combinan y la página siguiente
        se pide con los mismos: `mine`, `status`, `contact_id`, `opportunity_id`,
        `number` (exacto) y `expired`. 400: un filtro repetido o inválido. Sin líneas:
        están en el detalle.'
      parameters:
      - in: query
        name: contact_id
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - in: query
        name: expired
        schema:
          type: boolean
        description: Enviadas o vistas con la validez ya pasada, aún sin marcar como
          vencidas.
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: mine
        schema:
          type: boolean
        description: Las que creé yo.
      - in: query
        name: number
        schema:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^COT-[0-9]{6,}$
        description: El número exacto.
      - in: query
        name: opportunity_id
        schema:
          type: string
          format: uuid
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: query
        name: status
        schema:
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - APPROVED
          - SENT
          - VIEWED
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELLED
          type: string
          minLength: 1
        description: |-
          * `DRAFT` - Draft
          * `PENDING_APPROVAL` - Pending Approval
          * `APPROVED` - Approved
          * `SENT` - Sent
          * `VIEWED` - Viewed
          * `ACCEPTED` - Accepted
          * `REJECTED` - Rejected
          * `EXPIRED` - Expired
          * `CANCELLED` - Cancelled
      tags:
      - quotes
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
