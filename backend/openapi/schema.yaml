openapi: 3.0.3
info:
  title: Good Doggy CRM API
  version: 0.1.0
  description: Contrato de la API del backend. Fuente para el cliente TypeScript (orval).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Entrega la cookie `csrftoken` antes del primer método no seguro.
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: Inicia sesión. `INVALID_CREDENTIALS` no distingue el motivo del
        rechazo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session
      description: |-
        La sesión actual. 401 `NOT_AUTHENTICATED` si no hay, caducó o su usuario no está
        activo.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/organizations/:
    get:
      operationId: me_organizations
      description: |-
        Organizaciones del usuario: membresía activa y organización no suspendida. No abre
        un `tenant_scope`: lee con `user_scope`, que solo deja ver las membresías propias.
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/me/:
    get:
      operationId: me_context
      description: |-
        Quién es el usuario en esta organización y qué puede hacer. Informa: no autoriza. La
        interfaz lo usa para construir la navegación; cada ruta sigue comprobando su permiso.
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfContext'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Código estable. Lo único que decide el cliente.
        message:
          type: string
          description: Texto seguro para mostrar.
        fields:
          type: object
          additionalProperties: {}
          description: 'Solo en VALIDATION_ERROR: errores por campo (`_`: generales).'
      required:
      - code
    Grant:
      type: object
      properties:
        code:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
          description: Alcances concedidos. Vacío si el permiso no admite alcance.
      required:
      - code
      - scopes
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - email
      - password
    MemberOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    MemberUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    RoleName:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    ScopesEnum:
      enum:
      - OWN
      - TEAM
      - BRANCH
      - ORGANIZATION
      type: string
      description: |-
        * `OWN` - Own
        * `TEAM` - Team
        * `BRANCH` - Branch
        * `ORGANIZATION` - Organization
    SelfContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        organization:
          $ref: '#/components/schemas/MemberOrganization'
        membership_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
          description: 'Solo para mostrar: no autorizan nada.'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
      required:
      - membership_id
      - organization
      - permissions
      - roles
      - user
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie de sesión (`__Host-crm_session` en producción). Los métodos
        no seguros llevan además la cabecera `X-CSRFToken`.
