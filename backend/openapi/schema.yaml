            guardado ya no vale).'
        changed_at:
          type: string
          format: date-time
          nullable: true
          description: 'Último cambio; null: nunca.'
      required:
      - changed_at
      - initial
      - text
    AiHandoffReplyWriteRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
