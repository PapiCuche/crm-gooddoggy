        es una línea imprimible, `ids` con algo que no es un UUID o más de 50.'
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - in: query
        name: ids
        schema:
          type: string
          maxLength: 1850
        description: Hasta 50 identificadores UUID separados por comas, para resolver
          varios en una llamada. Los que no existen, son de otra organización o están
          borrados no aparecen.
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: query
        name: q
        schema:
          type: string
          maxLength: 254
