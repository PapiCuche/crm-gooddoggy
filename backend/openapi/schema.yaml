components:
  schemas:
    ActiveOrSuspendedEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ACTIVE` - ACTIVE
        * `SUSPENDED` - SUSPENDED
    AssignmentStrategyEnum:
      enum:
      - MANUAL
      - ROUND_ROBIN
      - LOAD_BALANCED
      - SKILL_BASED
      - AI_RULES
      type: string
      description: |-
        * `MANUAL` - Manual
        * `ROUND_ROBIN` - Round Robin
        * `LOAD_BALANCED` - Load Balanced
        * `SKILL_BASED` - Skill Based
        * `AI_RULES` - Ai Rules
    AuditActorTypeEnum:
      enum:
      - USER
      - AI_AGENT
      - SYSTEM
      - INTEGRATION
      - PLATFORM_STAFF
      type: string
      description: |-
        * `USER` - USER
        * `AI_AGENT` - AI_AGENT
        * `SYSTEM` - SYSTEM
        * `INTEGRATION` - INTEGRATION
        * `PLATFORM_STAFF` - PLATFORM_STAFF
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Cuándo ocurrió, según la base de datos.
        actor_type:
          $ref: '#/components/schemas/AuditActorTypeEnum'
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: 'Quién lo hizo: el usuario, si `actor_type` es `USER`.'
        actor_label:
          type: string
          nullable: true
        action:
          type: string
          description: '`modulo.accion`, por ejemplo `branch.updated`.'
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
          nullable: true
        entity_label:
          type: string
          nullable: true
          description: Cómo se llamaba la entidad en ese momento.
        changes:
          type: object
          additionalProperties: {}
          description: Por campo, `[antes, después]`. Ya redactado.
        metadata:
          type: object
          additionalProperties: {}
          description: Datos de contexto de la acción. Ya redactado.
        result:
          $ref: '#/components/schemas/AuditResultEnum'
        correlation_id:
          type: string
          nullable: true
          description: Común a las filas de una misma operación.
      required:
      - action
      - actor_id
      - actor_label
      - actor_type
      - changes
      - correlation_id
      - entity_id
      - entity_label
      - entity_type
      - id
      - metadata
      - occurred_at
      - result
    AuditResultEnum:
      enum:
      - SUCCESS
      - DENIED
      - FAILED
      type: string
      description: |-
        * `SUCCESS` - SUCCESS
        * `DENIED` - DENIED
        * `FAILED` - FAILED
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Clave corta de la sucursal, única en la organización.
        name:
          type: string
        address:
          type: string
        district:
          type: string
        city:
          type: string
        phone:
          type: string
        timezone:
          type: string
          description: Zona horaria, por su nombre IANA.
        is_active:
          type: boolean
      required:
      - address
      - city
      - code
      - district
      - id
      - is_active
      - name
      - phone
      - timezone
    BranchCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Se guarda en mayúsculas y no cambia después.
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          maxLength: 255
        district:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        timezone:
          type: string
          minLength: 1
          description: Zona horaria, por su nombre IANA.
          maxLength: 64
      required:
      - code
      - name
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Clave estable de la marca, única en la organización.
      required:
      - id
      - name
      - slug
    BrandCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: Si no se envía, se forma con el nombre. No cambia después.
          maxLength: 63
      required:
      - name
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: La categoría madre, o `null`.
        name:
          type: string
        slug:
          type: string
          description: Clave estable, única entre las hermanas.
        path:
          type: string
          description: 'La rama con los slugs: `/celulares/iphone/`.'
        depth:
          type: integer
          description: Nivel en el árbol, desde 1.
      required:
      - depth
      - id
      - name
      - parent_id
      - path
      - slug
    CategoryCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: Si no se envía, se forma con el nombre. No cambia después.
          maxLength: 63
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Dentro de qué categoría; sin él, en la raíz.
      required:
      - name
    ConditionEnum:
      enum:
      - NEW
      - OPEN_BOX
      - REFURBISHED
      - USED
      type: string
      description: |-
        * `NEW` - New
        * `OPEN_BOX` - Open Box
        * `REFURBISHED` - Refurbished
        * `USED` - Used
    Contact:
      type: object
      description: |-
        Los datos del propio contacto, también los personales: solo los ve quien lo tiene en su
        alcance. Nada enmascarado (el documento solo se enmascara en la auditoría).
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        primary_phone_e164:
          type: string
          nullable: true
          description: En E.164.
        primary_email:
          type: string
          nullable: true
        document_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ContactDocumentTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        document_number:
          type: string
          nullable: true
        owner_user_id:
          type: string
          format: uuid
          nullable: true
          description: El responsable.
        branch_id:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/ContactSourceEnum'
        created_by_user_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Sube con cada cambio.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactTag'
          description: Por nombre. Etiquetar no cambia `version`.
      required:
      - branch_id
      - created_at
      - created_by_user_id
      - display_name
      - document_number
      - document_type
      - first_name
      - id
      - last_name
      - owner_user_id
      - primary_email
      - primary_phone_e164
      - source
      - tags
      - updated_at
      - version
    ContactAssignmentRequest:
      type: object
      properties:
        owner_user_id:
          type: string
          format: uuid
          nullable: true
          description: 'El responsable: un miembro activo de la organización, o null.'
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: Una sucursal de la organización, o null.
        version:
          type: integer
          minimum: 1
          description: 'La que se leyó. Si ya no es la vigente: 409.'
      required:
      - branch_id
      - owner_user_id
      - version
    ContactCreateRequest:
      type: object
      properties:
        display_name:
          type: string
          description: Si no se envía, se forma con el nombre y el apellido.
          maxLength: 200
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        primary_phone_e164:
          type: string
          nullable: true
          description: 'E.164: `+` y el código del país; no se adivina.'
          maxLength: 32
        primary_email:
          type: string
          nullable: true
          maxLength: 254
        document_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ContactDocumentTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        document_number:
          type: string
          nullable: true
          description: Con su tipo.
          maxLength: 32
        source:
          $ref: '#/components/schemas/ContactSourceEnum'
    ContactDocumentTypeEnum:
      enum:
      - DNI
      - CE
      - RUC
      - PASSPORT
      type: string
      description: |-
        * `DNI` - Dni
        * `CE` - Ce
        * `RUC` - Ruc
        * `PASSPORT` - Passport
    ContactSourceEnum:
      enum:
      - INBOUND_MESSAGE
      - WALK_IN
      - REFERRAL
      - IMPORT
      - MANUAL
      - CAMPAIGN
      - AI
      type: string
      description: |-
        * `INBOUND_MESSAGE` - Inbound Message
        * `WALK_IN` - Walk In
        * `REFERRAL` - Referral
        * `IMPORT` - Import
        * `MANUAL` - Manual
        * `CAMPAIGN` - Campaign
        * `AI` - Ai
    ContactTag:
      type: object
      description: Una etiqueta que lleva el contacto (F4-11), también si se desactivó
        después.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: '`#rrggbb`.'
        is_active:
          type: boolean
      required:
      - color
      - id
      - is_active
      - name
    CurrentPrice:
      type: object
      properties:
        price_id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: ^[0-9]{1,12}(\.[0-9]{1,2})?$
        currency:
          type: string
