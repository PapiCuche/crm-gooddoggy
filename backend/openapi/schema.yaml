openapi: 3.0.3
info:
  title: Good Doggy CRM API
  version: 0.1.0
  description: Contrato de la API del backend. Fuente para el cliente TypeScript (orval).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Entrega la cookie `csrftoken` antes del primer método no seguro.
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Inicia sesión. `INVALID_CREDENTIALS` no distingue el motivo del rechazo. Si la cuenta
        tiene segundo factor, la contraseña correcta no inicia sesión: responde 202 con
        `mfa_required`, sin datos de la cuenta, y la sesión la inicia `POST /auth/login/mfa/`
        con un código, en los 5 minutos siguientes. 403 `PASSWORD_CHANGE_REQUIRED`: la
        contraseña correcta de una cuenta que creó un operador (`add_member`); no abre sesión ni
        empieza el segundo paso. La cuenta elige la suya con un enlace de recuperación.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPending'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/login/mfa/:
    post:
      operationId: auth_login_mfa
      description: |-
        El segundo paso del acceso: con un acceso a medias (la contraseña ya se comprobó) y
        un código de la aplicación de autenticación, o uno de respaldo, inicia la sesión. 400 en
        `code`: el código no vale, sin decir por qué; se puede probar otro. 401
        `MFA_LOGIN_NOT_STARTED`: no hay un acceso a medias, caducó (5 minutos) o dejó de valer:
        hay que volver a la contraseña. 429: demasiados intentos desde esta red, o demasiados
        códigos fallidos de esa cuenta en 24 horas; entonces tampoco vale el correcto.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/:
    get:
      operationId: auth_mfa_status
      description: |-
        El estado del segundo factor de la cuenta de la sesión: si tiene un dispositivo
        confirmado y desde cuándo, si dejó un alta empezada que aún se puede confirmar, y
        cuántos códigos de respaldo le quedan y, si esta sesión verificó el segundo factor hace
        menos de 15 minutos, los segundos que le quedan al step-up (`step_up_expires_in`; `null`
        si no). Nunca el secreto ni los códigos.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/backup-codes/:
    post:
      operationId: auth_mfa_backup_codes_regenerate
      description: |-
        Sustituye los códigos de respaldo de la cuenta por diez nuevos, con su contraseña
        actual y un código de la aplicación de autenticación. Los devuelve una sola vez; los
        anteriores dejan de valer todos. 400 en `password`: no es la contraseña de la cuenta.
        400 en `code`: el código no vale; uno de respaldo tampoco vale aquí, y no se gasta. 401:
        la sesión se revocó mientras tanto. 409 `MFA_NOT_ENABLED`: la cuenta no tiene segundo
        factor. 429: demasiados intentos desde esta red, o demasiados códigos fallidos de esa
        cuenta en 24 horas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRegenerateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaBackupCodes'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/disable/:
    post:
      operationId: auth_mfa_disable
      description: |-
        Quita el segundo factor de la cuenta, con su contraseña actual y un código (de la
        aplicación de autenticación o de respaldo). Borra el dispositivo y sus códigos de
        respaldo y cierra las demás sesiones; desde entonces la cuenta entra solo con su
        contraseña. 400 en `password`: no es la contraseña de la cuenta. 400 en `code`: el
        código no vale. 401: la sesión se revocó mientras tanto. 409 `MFA_NOT_ENABLED`: la
        cuenta no tiene segundo factor. 429: demasiados intentos desde esta red, o demasiados
        códigos fallidos de esa cuenta en 24 horas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/step-up/:
    post:
      operationId: auth_mfa_step_up
      description: |-
        Vuelve a verificar el segundo factor con un código (de la aplicación o de respaldo): la
        sesión queda verificada 15 minutos, con otro ID. 400 en `code`: no vale, sin decir por
        qué. 401: la sesión se revocó. 409 `MFA_NOT_ENABLED`: sin segundo factor. 429: demasiados
        códigos fallidos de la cuenta en 24 horas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaStepUpRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStepUpResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/totp/:
    post:
      operationId: auth_mfa_totp_start
      description: |-
        Empieza el alta del dispositivo TOTP de la cuenta: con su contraseña actual, crea el
        dispositivo sin confirmar (sustituye a otro sin confirmar) y devuelve su secreto, que no
        se vuelve a enseñar. No protege ni exige nada hasta confirmarlo. 400 en `password`: no
        es la contraseña de la cuenta. 409 `MFA_ALREADY_ENABLED`: ya hay un dispositivo
        confirmado. 429: demasiados intentos desde esta red.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentStartRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/totp/confirm/:
    post:
      operationId: auth_mfa_totp_confirm
      description: |-
        Confirma el alta del dispositivo TOTP con un código suyo: desde ahora la cuenta tiene
        segundo factor. Devuelve sus códigos de respaldo, que no se vuelven a enseñar, y cierra
        las demás sesiones de la cuenta. 400 en `code`: el código no vale; el quinto que no vale
        borra el alta. 401: la sesión se revocó mientras tanto. 409 `MFA_ENROLLMENT_NOT_STARTED`:
        no hay un alta empezada, caducó o se agotó con cinco códigos que no valen: hay que empezar
        otra. 409 `MFA_ALREADY_ENABLED`: ya estaba confirmada. 429: demasiados intentos.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentConfirmRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaBackupCodes'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_request
      description: |-
        Pide un enlace para recuperar la contraseña de la cuenta de ese correo. Responde 204
        exista o no la cuenta: si existe y puede recuperarse, le llega un correo. 400: no es
        una dirección de correo. 429: demasiadas peticiones desde esta red o para ese correo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: |-
        Cambia la contraseña de la cuenta de un enlace de recuperación. Cierra todas sus
        sesiones y no inicia ninguna. 400 `INVALID_RESET_LINK`: el enlace no vale, sin decir por
        qué (no existe, caducó, ya se usó o hay uno más nuevo). 400 `VALIDATION_ERROR` en
        `password`: el enlace vale y no se gasta, pero la contraseña no cumple las reglas. 429:
        demasiados intentos desde esta red.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session
      description: |-
        La sesión actual. 401 `NOT_AUTHENTICATED` si no hay, caducó o su usuario no está
        activo.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/test-accounts/:
    get:
      operationId: auth_test_accounts
      description: |-
        Con accesos de prueba activos, las cuentas sintéticas que existen, están activas y tienen
        su rol en la organización de pruebas. Sin ellos, 404 como una ruta que no existe. Nunca
        contraseñas ni nada que sirva para entrar: el login sigue siendo el de siempre.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccounts'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/invitations/accept/:
    post:
      operationId: invitations_accept
      description: |-
        Acepta la invitación: la membresía con sus roles y, sin cuenta, la crea (`first_name`,
        `password`); con cuenta, hay que tener su sesión. No inicia sesión. 400: el enlace no vale
        (`INVALID_INVITATION_LINK`, sin decir por qué) o `VALIDATION_ERROR`. 409 `ACCOUNT_EXISTS`:
        el correo tiene cuenta y no es la de la sesión. 429: demasiados intentos desde esta red.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/invitations/preview/:
    post:
      operationId: invitations_preview
      description: |-
        Lo que enseña el enlace de una invitación pendiente: la organización, el correo
        invitado y si hay que crear una cuenta. No cambia nada. 400 `INVALID_INVITATION_LINK`:
        el enlace no vale, sin decir por qué. 429: demasiados intentos desde esta red.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationLinkRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/organizations/:
    get:
      operationId: me_organizations
      description: |-
        Organizaciones del usuario: membresía activa y organización no suspendida. No abre
        un `tenant_scope`: lee con `user_scope`, que solo deja ver las membresías propias.
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/ai/budget/:
    get:
      operationId: ai_budget_retrieve
      description: 'Los topes mensual y diario de IA de la organización, en USD con
        6 decimales (`ai.manage` y segundo factor reciente); null si no hay: sin los
        dos, la IA no llama (`AI_BUDGET_NOT_SET`). No cuenta en el tope por persona
        de las escrituras.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiBudget'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      operationId: ai_budget_update
      description: 'Fija los dos topes (`ai.manage` y segundo factor reciente) y lo
        audita (`ai.limits.changed`, con el antes y el después). Importes en USD mayores
        que cero, con 6 decimales como mucho; el diario no supera al mensual. Bajar
        un tope por debajo de lo gastado corta la siguiente llamada. 429 `RATE_LIMITED`:
        el tope por persona de las escrituras, con `Retry-After`.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiBudgetWriteRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiBudget'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/ai/handoff-reply/:
    get:
      operationId: ai_handoff_reply_retrieve
      description: 'El texto de traspaso que propone el copiloto (`ai.manage` y segundo
        factor reciente): el de la organización o, sin él, el inicial. No cuenta en
        el tope por persona de las escrituras.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiHandoffReply'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      operationId: ai_handoff_reply_update
      description: 'Cambia el texto de traspaso de la organización (`ai.manage` y
        segundo factor reciente) y lo audita (`ai.handoff_reply.changed`, sin el texto).
        400 en `text`: un código y un mensaje por problema (`BODY`, `TOO_LONG`, `SCRIPT`,
        `SOON`, `FIGURE`, `DELIVERY`, `DISCOUNT`, `AVAILABILITY`, `TERMS`, `LINK`,
        `MARKUP`); nunca repite lo enviado. 429 `RATE_LIMITED`: el tope por persona
        de las escrituras, con `Retry-After`.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiHandoffReplyWriteRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiHandoffReply'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
