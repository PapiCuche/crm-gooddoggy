        sku:
          type: string
          description: Tal como vino.
        almacen:
          type: string
        cantidad:
          type: string
        quantity:
          type: integer
          nullable: true
        on_hand_seen:
          type: integer
          nullable: true
          description: 'El saldo al previsualizar: aplicar no pisa una celda que cambió.'
        errors:
          type: array
          items:
            type: string
      required:
      - action
      - almacen
      - cantidad
      - errors
      - id
      - on_hand_seen
      - quantity
      - row_number
      - sku
    Tag:
