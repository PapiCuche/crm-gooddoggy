      description: 'Busca variantes vivas de productos vivos entre todos los productos,
        paginadas por creación (ADR-016). `q` casa con el nombre de la variante, su
        SKU, su código de barras o el nombre del producto (contiene, sin distinguir
        mayúsculas); `ids` resuelve hasta 50 variantes en una llamada. Se exige `q`
