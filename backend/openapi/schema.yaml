              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: quotes_create
      description: 'Crea un borrador de quien lo crea, con `quotes.create` y `quotes.view`,
        de un contacto o de una oportunidad que ve (`contacts.view`, `opportunities.view`);
        si no, o no existen, un único 400 general. 400 en `price_list_id` o `variant_id`
        si la lista no se puede usar o una variante no tiene precio vigente. 409 `QUOTE_REFUSED`:
        la base lo rechazó. Repetirlo crea otro borrador.'
