      - client_message_id
      - created_at
      - delivered_at
      - delivery_status
      - direction
      - failed_at
      - id
      - message_type
      - provider_error_code
      - read_at
      - sender_type
      - sender_user_id
      - sent_at
    MessageAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MessageAttachmentKindEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/MessageAttachmentStatusEnum'
          description: |-
            `PENDING` y `DOWNLOADING`: aún se baja; `FAILED` y `EXPIRED`: no se pudo.

            * `PENDING` - PENDING
            * `DOWNLOADING` - DOWNLOADING
            * `DONE` - DONE
            * `FAILED` - FAILED
            * `EXPIRED` - EXPIRED
        mime_type:
          type: string
          nullable: true
          description: El tipo real (magic bytes), solo con `DONE`; nunca el que declaró
            el canal.
        size_bytes:
          type: integer
          nullable: true
          description: Solo con `DONE`.
        scan_status:
          nullable: true
          description: |-
            El antivirus, solo con `DONE`: `PENDING` (aún se analiza), `CLEAN`, `INFECTED` (nunca se sirve) o `ERROR` (no se pudo analizar; nunca se sirve).

            * `PENDING` - Pending
            * `CLEAN` - Clean
            * `INFECTED` - Infected
            * `ERROR` - Error
          oneOf:
          - $ref: '#/components/schemas/ScanStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        available:
          type: boolean
          description: Si `…/attachments/{id}/url/` lo sirve ahora (solo con antivirus
            `CLEAN`).
      required:
      - available
      - id
      - kind
      - mime_type
      - scan_status
      - size_bytes
      - status
