    TaskCreateRequest:
      type: object
      description: Lo que se envía de una tarea al crearla o cambiarla.
      properties:
        type:
          $ref: '#/components/schemas/TaskTypeEnum'
        description:
          type: string
          maxLength: 5000
        due_at:
          type: string
          nullable: true
          minLength: 1
          description: ISO 8601 con zona horaria, como 2026-11-20T09:00:00-05:00.
        is_all_day:
          type: boolean
          description: 'Importa el día, no la hora: el cliente muestra `due_at` sin
