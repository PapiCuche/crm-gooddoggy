components:
  schemas:
    ActiveOrSuspendedEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ACTIVE` - ACTIVE
        * `SUSPENDED` - SUSPENDED
    AssignmentStrategyEnum:
      enum:
      - MANUAL
      - ROUND_ROBIN
      - LOAD_BALANCED
      - SKILL_BASED
      - AI_RULES
      type: string
      description: |-
        * `MANUAL` - Manual
        * `ROUND_ROBIN` - Round Robin
        * `LOAD_BALANCED` - Load Balanced
        * `SKILL_BASED` - Skill Based
        * `AI_RULES` - Ai Rules
    AuditActorTypeEnum:
      enum:
      - USER
      - AI_AGENT
      - SYSTEM
      - INTEGRATION
      - PLATFORM_STAFF
      type: string
      description: |-
        * `USER` - USER
        * `AI_AGENT` - AI_AGENT
        * `SYSTEM` - SYSTEM
        * `INTEGRATION` - INTEGRATION
        * `PLATFORM_STAFF` - PLATFORM_STAFF
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Cuándo ocurrió, según la base de datos.
        actor_type:
          $ref: '#/components/schemas/AuditActorTypeEnum'
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: 'Quién lo hizo: el usuario, si `actor_type` es `USER`.'
        actor_label:
          type: string
          nullable: true
        action:
          type: string
          description: '`modulo.accion`, por ejemplo `branch.updated`.'
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
          nullable: true
        entity_label:
          type: string
          nullable: true
          description: Cómo se llamaba la entidad en ese momento.
        changes:
          type: object
          additionalProperties: {}
          description: Por campo, `[antes, después]`. Ya redactado.
        metadata:
          type: object
          additionalProperties: {}
          description: Datos de contexto de la acción. Ya redactado.
        result:
          $ref: '#/components/schemas/AuditResultEnum'
        correlation_id:
          type: string
          nullable: true
          description: Común a las filas de una misma operación.
      required:
      - action
      - actor_id
      - actor_label
      - actor_type
      - changes
      - correlation_id
      - entity_id
      - entity_label
      - entity_type
      - id
      - metadata
      - occurred_at
      - result
    AuditResultEnum:
      enum:
      - SUCCESS
      - DENIED
      - FAILED
      type: string
      description: |-
        * `SUCCESS` - SUCCESS
        * `DENIED` - DENIED
        * `FAILED` - FAILED
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Clave corta de la sucursal, única en la organización.
        name:
          type: string
        address:
          type: string
        district:
          type: string
        city:
          type: string
        phone:
          type: string
        timezone:
          type: string
          description: Zona horaria, por su nombre IANA.
        is_active:
          type: boolean
      required:
      - address
      - city
      - code
      - district
      - id
      - is_active
      - name
      - phone
      - timezone
    BranchCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Se guarda en mayúsculas y no cambia después.
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          maxLength: 255
        district:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        timezone:
          type: string
          minLength: 1
          description: Zona horaria, por su nombre IANA.
          maxLength: 64
      required:
      - code
      - name
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Clave estable de la marca, única en la organización.
      required:
      - id
      - name
      - slug
    BrandCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: Si no se envía, se forma con el nombre. No cambia después.
          maxLength: 63
      required:
      - name
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: La categoría madre, o `null`.
        name:
          type: string
        slug:
          type: string
          description: Clave estable, única entre las hermanas.
        path:
          type: string
          description: 'La rama con los slugs: `/celulares/iphone/`.'
        depth:
          type: integer
          description: Nivel en el árbol, desde 1.
      required:
      - depth
      - id
      - name
      - parent_id
      - path
      - slug
    CategoryCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: Si no se envía, se forma con el nombre. No cambia después.
          maxLength: 63
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Dentro de qué categoría; sin él, en la raíz.
      required:
      - name
    ConditionEnum:
      enum:
      - NEW
      - OPEN_BOX
      - REFURBISHED
      - USED
      type: string
      description: |-
        * `NEW` - New
        * `OPEN_BOX` - Open Box
        * `REFURBISHED` - Refurbished
        * `USED` - Used
    Error:
      type: object
      properties:
        code:
          type: string
          description: Código estable. Lo único que decide el cliente.
        message:
          type: string
          description: Texto seguro para mostrar.
        fields:
          type: object
          additionalProperties: {}
          description: 'Solo en VALIDATION_ERROR: errores por campo (`_`: generales).'
      required:
      - code
    Grant:
      type: object
      properties:
        code:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
          description: Alcances concedidos. Vacío si el permiso no admite alcance.
      required:
      - code
      - scopes
    GrantScopeRequest:
      type: object
      properties:
        scope:
          nullable: true
          description: |-
            Alcance de la concesión. Se omite, o es nulo, en un permiso sin alcance.

            * `OWN` - Own
            * `TEAM` - Team
            * `BRANCH` - Branch
            * `ORGANIZATION` - Organization
          oneOf:
          - $ref: '#/components/schemas/ScopesEnum'
          - $ref: '#/components/schemas/NullEnum'
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: El correo invitado, en la forma en que se guarda.
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/InvitationStatusEnum'
          description: 'El que se enseña: una pendiente cuya fecha pasó sale como
            `EXPIRED`.'
          readOnly: true
        expires_at:
          type: string
          format: date-time
        invited_by:
          type: string
          format: uuid
          description: La cuenta que invitó.
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role_ids
      - status
    InvitationStatusChangeRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RevokedEnum'
      required:
      - status
    InvitationStatusEnum:
      enum:
      - PENDING
      - ACCEPTED
      - REVOKED
      - EXPIRED
      type: string
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          description: El correo de la persona invitada.
          maxLength: 254
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Los roles de la organización que tendrá al aceptar, sin repetir.
          maxItems: 20
          minItems: 1
      required:
      - email
      - role_ids
    LoginMfaRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: El código de la aplicación de autenticación, o un código de
            respaldo.
          maxLength: 32
      required:
      - code
    LoginPending:
      type: object
      properties:
        mfa_required:
          type: boolean
          description: 'Siempre `true`: falta el segundo paso (`POST /auth/login/mfa/`).'
      required:
      - mfa_required
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - email
      - password
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la membresía.
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
        joined_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/MemberUser'
        default_branch:
          allOf:
          - $ref: '#/components/schemas/MemberDefaultBranch'
          nullable: true
          description: Su sucursal, o `null`. La cambia `PUT …/members/{id}/branch/`
            (F2-69).
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MemberRole'
          description: No autorizan nada. `id` nombra el rol en las rutas que lo asignan
            o quitan.
      required:
      - default_branch
      - id
      - joined_at
      - roles
      - status
      - user
    MemberBranch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la membresía.
        default_branch:
          allOf:
          - $ref: '#/components/schemas/MemberBranchRef'
          nullable: true
      required:
      - default_branch
      - id
    MemberBranchChangeRequest:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: La sucursal de la organización, o `null` para dejarlo sin ninguna.
      required:
      - branch_id
    MemberBranchRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
      - code
      - id
      - name
    MemberDefaultBranch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
      - code
      - id
      - name
    MemberOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    MemberRole:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        id:
          type: string
          format: uuid
          description: El que piden las rutas que asignan o quitan el rol.
      required:
      - code
      - id
      - name
    MemberStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la membresía.
        status:
          $ref: '#/components/schemas/ActiveOrSuspendedEnum'
      required:
      - id
      - status
    MemberStatusChangeRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ActiveOrSuspendedEnum'
      required:
      - status
    MemberUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
    MembershipStatusEnum:
      enum:
      - INVITED
      - ACTIVE
      - SUSPENDED
      - DEACTIVATED
      type: string
      description: |-
        * `INVITED` - INVITED
        * `ACTIVE` - ACTIVE
        * `SUSPENDED` - SUSPENDED
        * `DEACTIVATED` - DEACTIVATED
    MfaBackupCodes:
      type: object
      properties:
        backup_codes:
          type: array
          items:
            type: string
          description: Los códigos de respaldo, de un solo uso. Solo se enseñan esta
            vez.
      required:
      - backup_codes
    MfaDisableRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: La contraseña actual de la cuenta.
          maxLength: 1024
        code:
          type: string
          minLength: 1
          description: El código de la aplicación de autenticación, o un código de
            respaldo.
          maxLength: 32
      required:
      - code
      - password
    MfaEnrollment:
      type: object
      properties:
        secret:
          type: string
          description: El secreto en base32. Solo se enseña esta vez.
        uri:
          type: string
          description: La URI `otpauth://` para un código QR.
        expires_in:
          type: integer
          description: Segundos que quedan para confirmar el alta.
      required:
      - expires_in
      - secret
      - uri
    MfaEnrollmentConfirmRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: El código de seis dígitos de la aplicación de autenticación.
          maxLength: 16
      required:
      - code
    MfaEnrollmentStartRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: La contraseña actual de la cuenta.
          maxLength: 1024
      required:
      - password
    MfaRegenerateRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: La contraseña actual de la cuenta.
          maxLength: 1024
        code:
          type: string
          minLength: 1
          description: El código de la aplicación de autenticación. Uno de respaldo
            no vale aquí.
          maxLength: 32
      required:
      - code
      - password
    MfaStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: La cuenta tiene un dispositivo confirmado.
        enabled_at:
          type: string
          format: date-time
          nullable: true
          description: Desde cuándo; `null` si no lo tiene.
        enrollment_expires_in:
          type: integer
          nullable: true
          description: Segundos que quedan para confirmar un alta empezada; `null`
            si no hay ninguna.
        backup_codes_left:
          type: integer
          description: Códigos de respaldo que quedan sin gastar.
      required:
      - backup_codes_left
      - enabled
      - enabled_at
      - enrollment_expires_in
    NullEnum:
      enum:
      - null
    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    PaginatedAuditEntryList:
      type: object
      required:
      - results
      - next
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next:
          type: string
          nullable: true
          description: Cursor de la página siguiente; `null` en la última.
    PaginatedBranchList:
      type: object
      required:
      - results
      - next
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        next:
          type: string
          nullable: true
