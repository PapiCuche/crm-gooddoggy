        tiene existencias. 404: no es de la organización o ya está borrado.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: warehouse_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    ActiveOrSuspendedEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ACTIVE` - ACTIVE
        * `SUSPENDED` - SUSPENDED
    ActorTypeEnum:
      enum:
      - USER
      - AI_AGENT
      - SYSTEM
      - INTEGRATION
      type: string
      description: |-
        * `USER` - USER
        * `AI_AGENT` - AI_AGENT
        * `SYSTEM` - SYSTEM
        * `INTEGRATION` - INTEGRATION
    AddStageRequest:
      type: object
      description: 'Una etapa nueva: pide `name`, `code`, `stage_type`, `default_probability`
        y `color`.'
