openapi: 3.0.3
info:
  title: Good Doggy CRM API
  version: 0.1.0
  description: Contrato de la API del backend. Fuente para el cliente TypeScript (orval).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Entrega la cookie `csrftoken` antes del primer método no seguro.
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: Inicia sesión. `INVALID_CREDENTIALS` no distingue el motivo del
        rechazo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session
      description: |-
        La sesión actual. 401 `NOT_AUTHENTICATED` si no hay, caducó o su usuario no está
        activo.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/organizations/:
    get:
      operationId: me_organizations
      description: |-
        Organizaciones del usuario: membresía activa y organización no suspendida. No abre
        un `tenant_scope`: lee con `user_scope`, que solo deja ver las membresías propias.
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/branches/:
    get:
      operationId: branches_list
      description: |-
        Las sucursales de la organización, activas e inactivas. Paginado por orden de creación
        (ADR-016). `POST` crea una (F2-44).
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - branches
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: branches_create
      description: 'Crea una sucursal activa. `timezone` es `America/Lima` si no se
        envía. 409 `BRANCH_CODE_TAKEN`: ya hay en la organización una sucursal con
        ese código.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/branches/{branch_id}/:
    patch:
      operationId: branches_update
      description: 'Cambia lo que se envía; lo demás se queda como está, y el código
        no cambia. Enviar lo que ya hay no escribe nada. 404: la sucursal no es de
        la organización.'
      parameters:
      - in: path
        name: branch_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdateRequest'
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/me/:
    get:
      operationId: me_context
      description: |-
        Quién es el usuario en esta organización y qué puede hacer. Informa: no autoriza. La
        interfaz lo usa para construir la navegación; cada ruta sigue comprobando su permiso.
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfContext'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/members/:
    get:
      operationId: members_list
      description: |-
        Quién pertenece a la organización, en cualquier estado, y con qué roles. Paginado por
        orden de alta (ADR-016).
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - members
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/members/{membership_id}/roles/{role_id}/:
    put:
      operationId: members_roles_assign
      description: 'Asigna el rol al miembro. Repetirlo no cambia nada. 403: sin `users.manage`,
        uno mismo, o un rol que el actor no cubre. 404: el miembro o el rol no son
        de la organización. 409 `LAST_OWNER`: la organización no tiene rol Owner y
        no admite ningún cambio.'
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: members_roles_remove
      description: 'Quita el rol al miembro. 403: como al asignarlo. 404: el miembro
        no tiene ese rol, o no son de la organización. 409 `LAST_OWNER`: sería el
        último Owner activo, o la organización no tiene rol Owner.'
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/members/{membership_id}/status/:
    put:
      operationId: members_set_status
      description: |-
        Suspende (`SUSPENDED`) o reactiva (`ACTIVE`) a un miembro. Repetir la petición no cambia
        nada. 403: sin `users.manage`, uno mismo, o un miembro con un rol que el actor no podría
        asignar. 409 `LAST_OWNER`: sería el último Owner activo. 409 `INVALID_TRANSITION`: la
        membresía está invitada o dada de baja.
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberStatusChangeRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberStatus'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/permissions/:
    get:
      operationId: permissions_list
      description: Los permisos que se pueden conceder a un rol, ordenados por código.
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - roles
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalog'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/roles/:
    get:
      operationId: roles_list
      description: |-
        Los roles de la organización, con lo que concede cada uno y cuántos miembros lo tienen.
        Paginado por orden de creación (ADR-016). `POST` crea un rol propio (F2-29).
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - roles
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: roles_create
      description: 'Crea un rol propio, vacío: sin permisos y sin miembros. El código
        lo genera el servidor. 409 `ROLE_NAME_TAKEN`: ya hay en la organización un
        rol cuyo nombre se lee igual (mayúsculas, espacios repetidos, formas Unicode).
        409 `LAST_OWNER`: la organización no tiene rol Owner y no admite ningún cambio.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/roles/{role_id}/:
    patch:
      operationId: roles_update
      description: 'Cambia el nombre o la descripción del rol; lo que no se envía
        se queda como está, y el código no cambia. 403: como al borrarlo (sin `roles.manage`,
        un rol que el actor tiene asignado, el rol Owner, o una concesión del rol
        que el actor no cubre). 404: el rol no es de la organización. 409 `ROLE_NAME_TAKEN`:
        otro rol se lee igual. 409 `LAST_OWNER`: la organización no tiene rol Owner.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdateRequest'
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: roles_delete
      description: 'Borra el rol y sus concesiones. 403: sin `roles.manage`, un rol
        que el actor tiene asignado, el rol Owner, o una concesión del rol que el
        actor no cubre (o sensible, si no es Owner). 404: el rol no es de la organización.
        409 `ROLE_IS_SYSTEM`: es un rol de plantilla. 409 `ROLE_IN_USE`: el rol tiene
        miembros, en cualquier estado. 409 `LAST_OWNER`: la organización no tiene
        rol Owner.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - roles
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/roles/{role_id}/permissions/{code}/:
    put:
      operationId: roles_permissions_grant
      description: 'Deja el rol con ese permiso y ese alcance: lo concede o cambia
        el alcance que tenía. Repetirlo no cambia nada. Los miembros del rol lo reciben
        en su siguiente petición. 400: el alcance no corresponde al permiso. 403:
        sin `roles.manage`, un rol que el actor tiene asignado, el rol Owner, una
        concesión (la nueva o la anterior) que el actor no cubre, o un permiso sensible
        si el actor no es Owner. 404: el rol no es de la organización o el permiso
        no existe. 409 `LAST_OWNER`: la organización no tiene rol Owner y no admite
        ningún cambio.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantScopeRequest'
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: roles_permissions_revoke
      description: 'Retira ese permiso al rol. Los miembros del rol dejan de tenerlo
        en su siguiente petición. 403: como al concederlo (sin `roles.manage`, un
        rol que el actor tiene asignado, el rol Owner, una concesión que el actor
        no cubre, o un permiso sensible si el actor no es Owner). 404: el rol no es
        de la organización o no tiene esa concesión. 409 `LAST_OWNER`: la organización
        no tiene rol Owner y no admite ningún cambio.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - roles
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    ActiveOrSuspendedEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ACTIVE` - ACTIVE
        * `SUSPENDED` - SUSPENDED
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Clave corta de la sucursal, única en la organización.
        name:
          type: string
        address:
          type: string
        district:
          type: string
        city:
          type: string
        phone:
          type: string
        timezone:
          type: string
          description: Zona horaria, por su nombre IANA.
        is_active:
          type: boolean
      required:
      - address
      - city
      - code
      - district
      - id
      - is_active
      - name
      - phone
      - timezone
    BranchCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Se guarda en mayúsculas y no cambia después.
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          maxLength: 255
        district:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        timezone:
          type: string
          minLength: 1
          description: Zona horaria, por su nombre IANA.
          maxLength: 64
      required:
      - code
      - name
    Error:
      type: object
      properties:
        code:
          type: string
          description: Código estable. Lo único que decide el cliente.
        message:
          type: string
          description: Texto seguro para mostrar.
        fields:
          type: object
          additionalProperties: {}
          description: 'Solo en VALIDATION_ERROR: errores por campo (`_`: generales).'
      required:
      - code
    Grant:
      type: object
      properties:
        code:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
          description: Alcances concedidos. Vacío si el permiso no admite alcance.
      required:
      - code
      - scopes
    GrantScopeRequest:
      type: object
      properties:
        scope:
          nullable: true
          description: |-
            Alcance de la concesión. Se omite, o es nulo, en un permiso sin alcance.

            * `OWN` - Own
            * `TEAM` - Team
            * `BRANCH` - Branch
            * `ORGANIZATION` - Organization
          oneOf:
          - $ref: '#/components/schemas/ScopesEnum'
          - $ref: '#/components/schemas/NullEnum'
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - email
      - password
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la membresía.
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
        joined_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/MemberUser'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MemberRole'
          description: No autorizan nada. `id` nombra el rol en las rutas que lo asignan
            o quitan.
      required:
      - id
      - joined_at
      - roles
      - status
      - user
    MemberOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    MemberRole:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        id:
          type: string
          format: uuid
          description: El que piden las rutas que asignan o quitan el rol.
      required:
      - code
      - id
      - name
    MemberStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la membresía.
        status:
          $ref: '#/components/schemas/ActiveOrSuspendedEnum'
      required:
      - id
      - status
    MemberStatusChangeRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ActiveOrSuspendedEnum'
      required:
      - status
    MemberUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
    MembershipStatusEnum:
      enum:
      - INVITED
      - ACTIVE
      - SUSPENDED
      - DEACTIVATED
      type: string
      description: |-
        * `INVITED` - INVITED
        * `ACTIVE` - ACTIVE
        * `SUSPENDED` - SUSPENDED
        * `DEACTIVATED` - DEACTIVATED
    NullEnum:
      enum:
      - null
    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    PaginatedBranchList:
      type: object
      required:
      - results
      - next
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        next:
          type: string
          nullable: true
          description: Cursor de la página siguiente; `null` en la última.
    PaginatedMemberList:
      type: object
      required:
      - results
      - next
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next:
          type: string
          nullable: true
          description: Cursor de la página siguiente; `null` en la última.
    PaginatedRoleList:
      type: object
      required:
      - results
      - next
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        next:
          type: string
          nullable: true
          description: Cursor de la página siguiente; `null` en la última.
    PatchedBranchUpdateRequest:
      type: object
      description: Lo que se envía cambia; lo que no, se queda como está. El código
        no se cambia.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          maxLength: 255
        district:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        timezone:
          type: string
          minLength: 1
          description: Zona horaria, por su nombre IANA.
          maxLength: 64
        is_active:
          type: boolean
    PatchedRoleUpdateRequest:
      type: object
      description: Lo que se envía cambia; lo que no, se queda como está.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255
    Permission:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
          description: Módulo del producto al que pertenece.
        is_sensitive:
          type: boolean
          description: Solo lo delega y lo retira un Owner.
        supports_scope:
          type: boolean
          description: Si se concede con un alcance (`OWN`, `TEAM`, `BRANCH`, `ORGANIZATION`).
      required:
      - code
      - is_sensitive
      - module
      - supports_scope
    PermissionCatalog:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
      - results
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
          description: Nació de una plantilla del producto.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        members:
          type: integer
          description: Membresías con este rol, en cualquier estado.
        editable:
          type: boolean
          description: 'Falso para el rol Owner y para un rol que tiene asignado quien
            pregunta: la API rechaza cualquier cambio de sus concesiones. Es una ayuda
            para la interfaz, no una autorización: cada escritura aplica sus reglas.'
      required:
      - code
      - description
      - editable
      - id
      - is_system
      - members
      - name
      - permissions
    RoleCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255
      required:
      - name
    RoleGrant:
      type: object
      properties:
        code:
          type: string
          description: Código del permiso.
        scope:
          nullable: true
          description: |-
            Alcance concedido; `null` si el permiso no admite alcance.

            * `OWN` - Own
            * `TEAM` - Team
            * `BRANCH` - Branch
            * `ORGANIZATION` - Organization
          oneOf:
          - $ref: '#/components/schemas/ScopesEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - code
      - scope
    RoleName:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    ScopesEnum:
      enum:
      - OWN
      - TEAM
      - BRANCH
      - ORGANIZATION
      type: string
      description: |-
        * `OWN` - Own
        * `TEAM` - Team
        * `BRANCH` - Branch
        * `ORGANIZATION` - Organization
    SelfContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        organization:
          $ref: '#/components/schemas/MemberOrganization'
        membership_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
          description: 'Solo para mostrar: no autorizan nada.'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
      required:
      - membership_id
      - organization
      - permissions
      - roles
      - user
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie de sesión (`__Host-crm_session` en producción). Los métodos
        no seguros llevan además la cabecera `X-CSRFToken`.
