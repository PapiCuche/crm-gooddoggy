        por creación (ADR-016). `q` y `tag` filtran sin cambiar el orden; la página
        siguiente se pide con los mismos. 400: `q` o `tag` repetidos, `q` de más de
        254 caracteres o que no es una línea de texto imprimible, `tag` que no es
        un UUID.'
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
