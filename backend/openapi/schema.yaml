        revert:
          allOf:
          - $ref: '#/components/schemas/StockImportRevertResult'
          nullable: true
          description: Al revertirla.
      required:
      - applied_at
      - created_at
      - duplicate_of
      - encoding
      - error_rows
      - file_name
      - id
      - ignored_columns
      - new_count
      - result
      - revert
      - status
      - total_rows
      - unchanged_count
      - update_count
      - valid_rows
    StockImportCreateRequest:
      type: object
      properties:
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          minLength: 1
          description: El archivo CSV o XLSX, en base64.
          maxLength: 1402197
      required:
      - content
      - file_name
    StockImportResult:
      type: object
      properties:
        applied:
          type: integer
          description: Filas con su ajuste en el ledger.
        unchanged:
          type: integer
        stale:
          type: integer
          description: Celdas que cambiaron desde la previsualización.
        failed:
          type: integer
          description: Filas válidas que fallaron al aplicar.
      required:
      - applied
      - failed
      - stale
      - unchanged
    StockImportRevertRequest:
      type: object
      properties:
        confirm:
          type: boolean
          description: '`true`: lo que confirma quien revierte.'
      required:
      - confirm
    StockImportRevertResult:
      type: object
      properties:
        reverted:
          type: integer
          description: Celdas devueltas al saldo de antes.
        stale:
          type: integer
          description: 'Celdas que cambiaron después: no se tocan.'
        failed:
          type: integer
      required:
      - failed
      - reverted
      - stale
    StockImportRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        row_number:
          type: integer
