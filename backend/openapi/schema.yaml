openapi: 3.0.3
info:
  title: Good Doggy CRM API
  version: 0.1.0
  description: Contrato de la API del backend. Fuente para el cliente TypeScript (orval).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Entrega la cookie `csrftoken` antes del primer método no seguro.
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Inicia sesión. `INVALID_CREDENTIALS` no distingue el motivo del rechazo. Si la cuenta
        tiene segundo factor, la contraseña correcta no inicia sesión: responde 202 con
        `mfa_required`, sin datos de la cuenta, y la sesión la inicia `POST /auth/login/mfa/`
        con un código, en los 5 minutos siguientes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPending'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/login/mfa/:
    post:
      operationId: auth_login_mfa
      description: |-
        El segundo paso del acceso: con un acceso a medias (la contraseña ya se comprobó) y
        un código de la aplicación de autenticación, o uno de respaldo, inicia la sesión. 400 en
        `code`: el código no vale, sin decir por qué; se puede probar otro. 401
        `MFA_LOGIN_NOT_STARTED`: no hay un acceso a medias, caducó (5 minutos) o dejó de valer:
        hay que volver a la contraseña. 429: demasiados intentos desde esta red, o demasiados
        códigos fallidos de esa cuenta en 24 horas; entonces tampoco vale el correcto.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/:
    get:
      operationId: auth_mfa_status
      description: |-
        El estado del segundo factor de la cuenta de la sesión: si tiene un dispositivo
        confirmado y desde cuándo, si dejó un alta empezada que aún se puede confirmar, y
        cuántos códigos de respaldo le quedan y, si esta sesión verificó el segundo factor hace
        menos de 15 minutos, los segundos que le quedan al step-up (`step_up_expires_in`; `null`
        si no). Nunca el secreto ni los códigos.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/backup-codes/:
    post:
      operationId: auth_mfa_backup_codes_regenerate
      description: |-
        Sustituye los códigos de respaldo de la cuenta por diez nuevos, con su contraseña
        actual y un código de la aplicación de autenticación. Los devuelve una sola vez; los
        anteriores dejan de valer todos. 400 en `password`: no es la contraseña de la cuenta.
        400 en `code`: el código no vale; uno de respaldo tampoco vale aquí, y no se gasta. 401:
        la sesión se revocó mientras tanto. 409 `MFA_NOT_ENABLED`: la cuenta no tiene segundo
        factor. 429: demasiados intentos desde esta red, o demasiados códigos fallidos de esa
        cuenta en 24 horas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRegenerateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaBackupCodes'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/disable/:
    post:
      operationId: auth_mfa_disable
      description: |-
        Quita el segundo factor de la cuenta, con su contraseña actual y un código (de la
        aplicación de autenticación o de respaldo). Borra el dispositivo y sus códigos de
        respaldo y cierra las demás sesiones; desde entonces la cuenta entra solo con su
        contraseña. 400 en `password`: no es la contraseña de la cuenta. 400 en `code`: el
        código no vale. 401: la sesión se revocó mientras tanto. 409 `MFA_NOT_ENABLED`: la
        cuenta no tiene segundo factor. 429: demasiados intentos desde esta red, o demasiados
        códigos fallidos de esa cuenta en 24 horas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/step-up/:
    post:
      operationId: auth_mfa_step_up
      description: |-
        Vuelve a verificar el segundo factor con un código (de la aplicación o de respaldo): la
        sesión queda verificada 15 minutos, con otro ID. 400 en `code`: no vale, sin decir por
        qué. 401: la sesión se revocó. 409 `MFA_NOT_ENABLED`: sin segundo factor. 429: demasiados
        códigos fallidos de la cuenta en 24 horas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaStepUpRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStepUpResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/totp/:
    post:
      operationId: auth_mfa_totp_start
      description: |-
        Empieza el alta del dispositivo TOTP de la cuenta: con su contraseña actual, crea el
        dispositivo sin confirmar (sustituye a otro sin confirmar) y devuelve su secreto, que no
        se vuelve a enseñar. No protege ni exige nada hasta confirmarlo. 400 en `password`: no
        es la contraseña de la cuenta. 409 `MFA_ALREADY_ENABLED`: ya hay un dispositivo
        confirmado. 429: demasiados intentos desde esta red.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentStartRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/mfa/totp/confirm/:
    post:
      operationId: auth_mfa_totp_confirm
      description: |-
        Confirma el alta del dispositivo TOTP con un código suyo: desde ahora la cuenta tiene
        segundo factor. Devuelve sus códigos de respaldo, que no se vuelven a enseñar, y cierra
        las demás sesiones de la cuenta. 400 en `code`: el código no vale; el quinto que no vale
        borra el alta. 401: la sesión se revocó mientras tanto. 409 `MFA_ENROLLMENT_NOT_STARTED`:
        no hay un alta empezada, caducó o se agotó con cinco códigos que no valen: hay que empezar
        otra. 409 `MFA_ALREADY_ENABLED`: ya estaba confirmada. 429: demasiados intentos.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentConfirmRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaBackupCodes'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_request
      description: |-
        Pide un enlace para recuperar la contraseña de la cuenta de ese correo. Responde 204
        exista o no la cuenta: si existe y puede recuperarse, le llega un correo. 400: no es
        una dirección de correo. 429: demasiadas peticiones desde esta red o para ese correo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: |-
        Cambia la contraseña de la cuenta de un enlace de recuperación. Cierra todas sus
        sesiones y no inicia ninguna. 400 `INVALID_RESET_LINK`: el enlace no vale, sin decir por
        qué (no existe, caducó, ya se usó o hay uno más nuevo). 400 `VALIDATION_ERROR` en
        `password`: el enlace vale y no se gasta, pero la contraseña no cumple las reglas. 429:
        demasiados intentos desde esta red.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session
      description: |-
        La sesión actual. 401 `NOT_AUTHENTICATED` si no hay, caducó o su usuario no está
        activo.
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/test-accounts/:
    get:
      operationId: auth_test_accounts
      description: |-
        Con accesos de prueba activos, las cuentas sintéticas que existen, están activas y tienen
        su rol en la organización de pruebas. Sin ellos, 404 como una ruta que no existe. Nunca
        contraseñas ni nada que sirva para entrar: el login sigue siendo el de siempre.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccounts'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/organizations/:
    get:
      operationId: me_organizations
      description: |-
        Organizaciones del usuario: membresía activa y organización no suspendida. No abre
        un `tenant_scope`: lee con `user_scope`, que solo deja ver las membresías propias.
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/audit/:
    get:
      operationId: audit_list
      description: |-
        La auditoría de la organización, de la fila más reciente a la más antigua. Paginada por
        cursor (ADR-016). Cada fila llega como se guardó: los valores con aspecto de secreto se
        redactaron al escribirla (ADR-011). Solo lectura. Los filtros son por valor exacto y se
        cumplen todos; la página siguiente se pide con los mismos. 400: un filtro con un valor que
        ese campo no puede tener, o repetido.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: La acción exacta, por ejemplo `role.created`.
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
        description: Quién lo hizo.
      - in: query
        name: actor_type
        schema:
          enum:
          - USER
          - AI_AGENT
          - SYSTEM
          - INTEGRATION
          - PLATFORM_STAFF
          type: string
          minLength: 1
        description: |-
          * `USER` - USER
          * `AI_AGENT` - AI_AGENT
          * `SYSTEM` - SYSTEM
          * `INTEGRATION` - INTEGRATION
          * `PLATFORM_STAFF` - PLATFORM_STAFF
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - in: query
        name: entity_id
        schema:
          type: string
          format: uuid
        description: La historia de una entidad.
      - in: query
        name: entity_type
        schema:
          type: string
          minLength: 1
          maxLength: 50
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - audit
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/branches/:
    get:
      operationId: branches_list
      description: |-
        Las sucursales de la organización, activas e inactivas. Paginado por orden de creación
        (ADR-016). `POST` crea una (F2-44).
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - branches
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: branches_create
      description: 'Crea una sucursal activa. `timezone` es `America/Lima` si no se
        envía. 409 `BRANCH_CODE_TAKEN`: ya hay en la organización una sucursal con
        ese código.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/branches/{branch_id}/:
    patch:
      operationId: branches_update
      description: 'Cambia lo que se envía; lo demás se queda como está, y el código
        no cambia. Enviar lo que ya hay no escribe nada. 404: la sucursal no es de
        la organización.'
      parameters:
      - in: path
        name: branch_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdateRequest'
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/o/{org_slug}/brands/:
    get:
      operationId: brands_list
      description: |-
        Las marcas de la organización, sin las borradas. Paginado por orden de creación
        (ADR-016). `POST` crea una.
      parameters:
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
