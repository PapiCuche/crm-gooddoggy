        name:
          type: string
          minLength: 1
          maxLength: 100
        stage_type:
          $ref: '#/components/schemas/StageTypeEnum'
        default_probability:
          type: integer
          maximum: 100
          minimum: 0
          description: WON 100, LOST 0.
        stale_after_days:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: '`null`: nunca.'
        color:
          type: string
          minLength: 1
          description: '`#rrggbb`.'
          maxLength: 7
        requires_fields:
          type: object
          additionalProperties: {}
          description: Objeto JSON de hasta 4096 bytes y 4 niveles.
        is_active:
          type: boolean
        code:
          type: string
          minLength: 1
          description: Minúsculas, cifras y guiones; único en el pipeline. No cambia.
          maxLength: 30
        position:
          type: integer
          maximum: 30
          minimum: 0
          description: 'Su lugar entre las etapas (desde 0). Sin él: una OPEN tras
            la última OPEN; otra, al final.'
      required:
      - code
      - color
      - default_probability
      - name
      - stage_type
    AiBudget:
      type: object
      properties:
        monthly_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          nullable: true
          description: 'Tope del mes de Lima en USD; null: sin tope.'
        daily_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          nullable: true
          description: 'Tope del día de Lima en USD; null: sin tope.'
      required:
      - daily_usd
      - monthly_usd
    AiBudgetWriteRequest:
      type: object
      properties:
        monthly_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
        daily_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          description: No puede superar al mensual.
      required:
      - daily_usd
      - monthly_usd
    AiHandoffReply:
      type: object
