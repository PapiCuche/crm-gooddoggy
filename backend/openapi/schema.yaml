  /api/v1/o/{org_slug}/conversations/:
    get:
      operationId: conversations_list
      description: 'Las conversaciones dentro del alcance de `conversations.view`,
        la de mensaje más reciente primero (`last_message_at`, `id`; cursor de dos
        valores). `box`, `status` y `unanswered` se combinan y la página siguiente
        se pide con los mismos. 400: un filtro repetido o no válido.'
      parameters:
      - in: query
        name: box
        schema:
          enum:
          - all
          - mine
          - unassigned
          type: string
          minLength: 1
        description: |-
          `all` (por omisión), `mine` (asignadas a quien consulta) o `unassigned`.

          * `all` - all
          * `mine` - mine
          * `unassigned` - unassigned
      - name: cursor
        in: query
        required: false
        description: El `next` de la página anterior. Sin él, la primera página.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Filas por página.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - in: query
        name: status
        schema:
          enum:
          - OPEN
          - PENDING
          - WAITING_CUSTOMER
          - WAITING_INTERNAL
          - RESOLVED
          - CLOSED
          type: string
          minLength: 1
        description: |-
          * `OPEN` - Open
          * `PENDING` - Pending
          * `WAITING_CUSTOMER` - Waiting Customer
          * `WAITING_INTERNAL` - Waiting Internal
          * `RESOLVED` - Resolved
          * `CLOSED` - Closed
      - in: query
        name: unanswered
        schema:
          type: boolean
        description: '`true`: solo las abiertas cuyo último mensaje es del cliente
          (sin responder).'
      tags:
      - conversations
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationList'
          description: ''
        '400':
