        schema:
          type: string
        required: true
      - in: query
        name: q
        schema:
          type: string
          maxLength: 254
        description: 'Busca dentro del alcance. Con `+` (o `00`) y cifras, ignorando
          espacios, puntos, guiones y paréntesis: el teléfono empieza por ese prefijo
          E.164. Si no: el nombre contiene el texto o el correo empieza por él, sin
          distinguir mayúsculas. Unas cifras sin `+` no son un teléfono. Vacío: sin
          filtro.'
      - in: query
        name: tag
