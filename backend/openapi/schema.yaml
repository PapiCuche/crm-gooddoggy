          type: string
        sender_user_id:
          type: string
          format: uuid
          nullable: true
        message_type:
          type: string
          description: '`TEXT`, `NOTE`, `UNSUPPORTED` (un tipo que el canal aún no
            admite) o un medio entrante: `IMAGE` (también un sticker), `AUDIO` o `VIDEO`,
            con `body` una frase fija y el medio en `attachment`; o saliente: `IMAGE`
            o `DOCUMENT`, con `body` el pie de foto o «Imagen» o «Documento». Un valor
            desconocido se trata como no soportado.'
        body:
          type: string
          nullable: true
          description: '`null` si no se puede ver el contacto (`contacts.view`).'
        client_message_id:
          type: string
          format: uuid
          nullable: true
          description: Solo en los mensajes salientes de quien consulta.
        delivery_status:
          type: string
          nullable: true
          description: Solo en lo saliente.
        provider_error_code:
          nullable: true
          description: |-
            Por qué un mensaje saliente quedó `FAILED`: un código cerrado propio, nunca el texto del proveedor; `null` si no falló (o falló antes de que se guardara el motivo).

            * `CONVERSATION_CLOSED` - CONVERSATION_CLOSED
            * `CHANNEL_UNAVAILABLE` - CHANNEL_UNAVAILABLE
            * `CONTACT_BLOCKED` - CONTACT_BLOCKED
            * `WINDOW_CLOSED` - WINDOW_CLOSED
            * `CONSENT_REVOKED` - CONSENT_REVOKED
            * `ADAPTER_REJECTED` - ADAPTER_REJECTED
            * `RETRIES_EXHAUSTED` - RETRIES_EXHAUSTED
            * `TOKEN_INVALID` - TOKEN_INVALID
            * `RECIPIENT_UNREACHABLE` - RECIPIENT_UNREACHABLE
            * `PROVIDER_REJECTED` - PROVIDER_REJECTED
            * `PROVIDER_UNKNOWN` - PROVIDER_UNKNOWN
            * `RATE_LIMITED` - RATE_LIMITED
            * `QUALITY_BLOCKED` - QUALITY_BLOCKED
            * `TEMPLATE_UNAVAILABLE` - TEMPLATE_UNAVAILABLE
            * `PROVIDER_ERROR` - PROVIDER_ERROR
            * `MEDIA_NOT_SCANNED` - MEDIA_NOT_SCANNED
            * `MESSAGES_ACCESS_OFF` - MESSAGES_ACCESS_OFF
          oneOf:
          - $ref: '#/components/schemas/ProviderErrorCodeEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
