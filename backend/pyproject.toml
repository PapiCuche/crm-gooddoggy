[project]
name = "crm-backend"
version = "0.1.0"
description = "Good Doggy CRM backend (Django, ASGI)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "boto3==1.43.105",
    "celery==5.6.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "django==5.2.17",
    "djangorestframework==3.18.2",
    "drf-spectacular==0.30.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "sentry-sdk==2.69.1",
    "structlog==26.1.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "django-stubs==5.2.9",
    "django-stubs-ext==5.2.9",
    "import-linter==2.15",
    "mypy==1.19.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.9",
]

[tool.uv]
required-version = "==0.12.19"
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, S seguridad (bandit), DJ django
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert en tests

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]  # sin py.typed (F1-04); types-channels exige django-stubs 6
module = [
    "celery.*", "kombu.*", "channels.*", "boto3.*", "botocore.*", "rest_framework.*",
    "drf_spectacular.*", "openpyxl.*",
]
follow_imports = "skip"  # tipos Any: sin stubs compatibles
ignore_missing_imports = true

[[tool.mypy.overrides]]  # rest_framework es Any (arriba): solo aquí se subclasifica DRF
module = [
    "apps.access.permissions", "core.api.authentication", "core.api.errors",
    "core.api.permissions", "tests.test_access_api", "tests.test_api_conventions",
    "core.api.pagination", "core.api.strict", "tests.test_pagination", "tests.test_mfa_step_up",
    "tests.test_step_up_check",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]  # vistas y serializadores de DRF: clases y decoradores sin tipos
module = ["apps.*.api.*", "core.api.parsers", "tests.test_auth_api"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]  # asgiref.testing sin anotaciones
module = ["tests.test_entrypoints", "tests.test_inbox_realtime"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# ADR-012 §3: deprecaciones como error desde el inicio (facilita el salto a Django 6.2 LTS).
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]
# F3-38 (#365): un test que espera un bloqueo sin `lock_timeout` falla a los 300 s (pytest-timeout)
# en vez de colgar la suite hasta matarla a mano; el job de CI tiene además su `timeout-minutes`.
timeout = 300
# Sin el plugin, `timeout` sería solo un aviso y la suite correría sin límite: falla al arrancar.
required_plugins = ["pytest-timeout"]

[tool.importlinter]
root_packages = ["config", "core", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core (kernel) no depende de config ni de apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["config", "apps"]

[[tool.importlinter.contracts]]
name = "Capas (module-dependencies §1): inventory | pricing > catalog | contacts (L3) > provisioning | members (L2+) > organizations | access | accounts (L2) > audit | files | imports (L1) > core (L0)"
type = "layers"
layers = [
    # L4: el copiloto (ADR-034 §2, F8-07a): lee el negocio con sus selectores y servicios
    "apps.ai_agents",
    # L3: dominio de negocio (module-dependencies §1). inventory depende de catalog (§2): almacenes
    # y stock (Fase 3). catalog, el catálogo (Fase 3); contacts, los clientes (Fase 4):
    # independientes entre sí, no se importan. pricing, los precios (F3-40): sobre catalog, en la
    # misma fila que inventory, sin importarse entre sí. deals, los pipelines (F5-01): sobre
    # contacts (las oportunidades, F5-03, referenciarán contactos), nunca al revés. conversations,
    # el Inbox (F6-01): sobre contacts, en la fila de deals, sin importarse entre sí.
    "apps.inventory | apps.pricing | apps.deals | apps.conversations | apps.tasks | apps.quotes",
    "apps.catalog | apps.contacts",
    # L2+: unen módulos de L2. provisioning, el alta (F2-06); members, sus miembros (ADR-017)
    "apps.provisioning | apps.members",
    "apps.organizations | apps.access | apps.accounts",
    # imports: las tablas genéricas de importación y los lectores CSV y XLSX; cada módulo valida
    # y aplica las suyas
    "apps.audit | apps.files | apps.imports",
    "core",
]
# Las únicas aristas permitidas entre módulos de la misma fila (el resto, y la inversa, prohibidas):
# F5-08, tasks a deals (la oportunidad de la tarea); F6-06b, deals a conversations (el alcance).
ignore_imports = [
    "apps.tasks.models -> apps.deals.models",
    "apps.tasks.commands -> apps.deals.models",
    "apps.deals.api.opportunities -> apps.conversations.selectors",
    "apps.tasks.apps -> apps.deals.scopes",  # F5-08b: el alcance por responsable es el mismo
    "apps.quotes.apps -> apps.deals.scopes",  # F5-09d: y por quien creó la cotización
    "apps.tasks.api.tasks -> apps.deals.selectors",  # la oportunidad en el alcance de quien crea
    "apps.quotes.commands -> apps.deals.models",  # F5-09a: la oportunidad de la cotización
    "apps.quotes.commands -> apps.pricing.services",  # y los precios, solo del `PricingService`
    "apps.quotes.discounts -> apps.pricing.floor",  # F5-09b2: un precio manual cubre el costo
    "apps.quotes.policies -> apps.pricing.services",  # F5-09b4: la lista de una política existe
    "apps.quotes.answers -> apps.deals.models",  # F5-09c3: aceptar mueve la oportunidad
    "apps.quotes.answers -> apps.deals.opportunities",
    "apps.quotes.answers -> apps.deals.opportunity_stages",
]

[[tool.importlinter.contracts]]
name = "ai_gateway (L1) no importa módulos de negocio (L3) (ADR-034 §2, F8-03a)"
type = "forbidden"
source_modules = ["apps.ai_gateway"]
forbidden_modules = ["apps.inventory", "apps.pricing", "apps.deals", "apps.conversations", "apps.tasks", "apps.quotes", "apps.catalog", "apps.contacts", "apps.ai_agents"]

[[tool.importlinter.contracts]]
name = "Ningún módulo de L0 a L3 importa apps.ai_* (ADR-034 §2, F8-05)"
type = "forbidden"
source_modules = ["core", "apps.access", "apps.accounts", "apps.audit", "apps.catalog", "apps.contacts", "apps.conversations", "apps.deals", "apps.files", "apps.imports", "apps.inventory", "apps.members", "apps.organizations", "apps.pricing", "apps.provisioning", "apps.quotes", "apps.tasks"]
forbidden_modules = ["apps.ai_gateway", "apps.ai_agents"]

[[tool.importlinter.contracts]]
name = "apps.ai_* no importa la API ni las tareas de otros módulos (ADR-034 §2, F8-05)"
type = "forbidden"
source_modules = ["apps.ai_gateway"]
forbidden_modules = ["apps.access.api", "apps.accounts.api", "apps.accounts.tasks", "apps.audit.api", "apps.members.api", "apps.organizations.api", "apps.provisioning"]

[[tool.importlinter.contracts]]
name = "ai_agents no importa la API, las tareas, los comandos ni lo que escribe, descifra o lee personas de nadie: solo lee el catálogo, el inventario y los precios (ADR-034 §2, §11, F8-07a, F8-07e); pricing.costs ya lo cierra su contrato protected"
type = "forbidden"
source_modules = ["apps.ai_agents"]
forbidden_modules = [
    "apps.access.api", "apps.accounts.api", "apps.accounts.tasks", "apps.ai_gateway.api", "apps.ai_gateway.tasks",
    "apps.audit.api", "apps.catalog.api", "apps.contacts.api", "apps.conversations.api",
    "apps.conversations.tasks", "apps.deals.api", "apps.inventory.api", "apps.inventory.tasks", "apps.members.api",
    "apps.organizations.api", "apps.pricing.api", "apps.provisioning", "apps.quotes.api", "apps.quotes.tasks",
    "apps.tasks.api", "apps.pricing.floor", "apps.catalog.brands", "apps.catalog.categories",
    "apps.catalog.products", "apps.inventory.stock", "apps.inventory.warehouses", "apps.inventory.imports",
    "apps.inventory.reservations", "apps.inventory.transfers", "apps.conversations.commands",
    # F8-07e: los servicios que escriben (permisos, auditoría), las llaves y el interruptor de la
    # IA, el envío por WhatsApp, lo cifrado y los contactos (personas, no catálogo)
    "apps.access.services", "apps.ai_gateway.switch", "apps.ai_gateway.accounts", "apps.ai_gateway.keys",
    "apps.audit.services", "apps.conversations.whatsapp", "core.sealed", "apps.contacts.models",
    "apps.contacts.selectors",
]
# F8-08b (#1019, ADR-034 §7): el registro del copiloto audita su borrador con solo ids
# (`ai.suggestion.created`, `ai.summary.created`); que nada más de ai_agents llegue a `records` (y así
# a la auditoría) lo sostiene el contrato de F8-08b. F8-08d: solo el contexto del copiloto lee los
# mensajes con `conversations.selectors.messages`, como pide ADR-034 §7; ese módulo importa
# contactos y medios para otras lecturas que el contexto no usa, y que solo `apps` importe
# `context` lo sostiene el contrato de F8-08d. F8-08g (#1024): el runtime del copiloto llama al
# modelo solo por `gateway.complete` (ADR-034 §2: toda llamada pasa por `ai_gateway`), que abre la
# clave y mira el interruptor. `ignore_imports` quita esa arista de todo el grafo: el contrato
# `protected` de F8-08g impide que otro módulo llegue al gateway a través del runtime, y una prueba
# fija que el runtime solo usa `complete` y `GatewayError` del gateway. Los demás no cambian.
ignore_imports = [
    "apps.ai_agents.records -> apps.audit.services",
    "apps.ai_agents.context -> apps.conversations.selectors",
    "apps.ai_agents.copilot -> apps.ai_gateway.gateway",
]

[[tool.importlinter.contracts]]
# F8-08d: ese `ignore_imports` quita la arista para todo el grafo; sin este contrato, cualquier
# módulo de `ai_agents` llegaría a contactos y a `core.sealed` a través de `context`. Solo el
# arranque y, a propósito, el runtime del copiloto (F8-08g, #1024) lo importan. Que ningún módulo
# de `ai_agents` importe `apps.ai_agents.apps` lo sostiene el contrato siguiente.
name = "Solo apps.ai_agents.apps y el runtime importan el contexto del copiloto (F8-08d, F8-08g)"
type = "protected"
protected_modules = ["apps.ai_agents.context"]
allowed_importers = ["apps.ai_agents.apps", "apps.ai_agents.copilot"]

[[tool.importlinter.contracts]]
# F8-08d: cierra el resto del contrato anterior; nada de `ai_agents` importa su arranque (y así
# `context`). El runtime (F8-08g, #1024) entra aquí al crearse. `apps.ai_agents.api` cubre las
# vistas de sugerir (F8-08h) y resumir (F8-08i), que comparten módulo.
name = "Ningún módulo de ai_agents importa su arranque (F8-08d)"
type = "forbidden"
source_modules = ["apps.ai_agents.tools", "apps.ai_agents.registry", "apps.ai_agents.fields", "apps.ai_agents.models", "apps.ai_agents.migrations", "apps.ai_agents.records", "apps.ai_agents.context", "apps.ai_agents.guard", "apps.ai_agents.detectors", "apps.ai_agents.copilot", "apps.ai_agents.api"]
forbidden_modules = ["apps.ai_agents.apps"]

[[tool.importlinter.contracts]]
# F8-08h (#771) y F8-08i (#1025): las rutas llegan al registro, al contexto, a las tools y al gateway
# solo por el runtime
name = "La ruta del copiloto importa el runtime, no lo que el runtime usa (F8-08h)"
type = "forbidden"
source_modules = ["apps.ai_agents.api"]
forbidden_modules = ["apps.ai_agents.records", "apps.ai_agents.context", "apps.ai_agents.registry", "apps.ai_gateway"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# `ignore_imports` quita la arista `records -> audit.services` de todo el grafo: sin este contrato,
# una tool que importe `records` llegaría al escritor de la auditoría sin que nadie lo viera. Lo que
# llama a `records.save` es el runtime del copiloto (F8-08g, #1024), que no está en esta lista.
# El Output Guard (F8-08e, y sus detectores, F8-08f) es puro: devuelve sus hallazgos y el runtime los
# registra.
name = "Solo el runtime del copiloto importa su registro (F8-08b)"
type = "forbidden"
source_modules = ["apps.ai_agents.tools", "apps.ai_agents.registry", "apps.ai_agents.fields", "apps.ai_agents.models", "apps.ai_agents.apps", "apps.ai_agents.migrations", "apps.ai_agents.context", "apps.ai_agents.guard", "apps.ai_agents.detectors"]
forbidden_modules = ["apps.ai_agents.records"]

[[tool.importlinter.contracts]]
# F8-08g (#1024): la arista `copilot -> ai_gateway.gateway` está ignorada arriba; si otro módulo
# importara el runtime, llegaría por él a la clave y al interruptor sin que nadie lo viera.
name = "Nadie importa el runtime del copiloto salvo su ruta (F8-08g)"
type = "protected"
protected_modules = ["apps.ai_agents.copilot"]
# F8-08h (#771): a propósito, solo el módulo de las vistas del copiloto; nada más llega al runtime.
# F8-08i (#1025): la vista de resumir vive en ese mismo módulo, así que la lista no crece.
allowed_importers = ["apps.ai_agents.api.views"]

[[tool.importlinter.contracts]]
name = "Fronteras de alta: solo provisioning importa los bootstrap.py de L2 (F2-06)"
type = "protected"
protected_modules = ["apps.access.bootstrap", "apps.accounts.bootstrap", "apps.organizations.bootstrap"]
allowed_importers = ["apps.provisioning"]

[[tool.importlinter.contracts]]
name = "Membresías e invitaciones: solo members llama a organizations.services (ADR-017)"
type = "protected"
protected_modules = ["apps.organizations.services"]
allowed_importers = ["apps.members"]

[[tool.importlinter.contracts]]
name = "Comandos del catálogo: solo su API los importa (F3-01, F3-04)"
type = "protected"
protected_modules = ["apps.catalog.brands", "apps.catalog.categories", "apps.catalog.products"]
allowed_importers = ["apps.catalog.api"]

[[tool.importlinter.contracts]]
name = "Comandos del inventario: solo su API y su job los importan (F3-08, F3-09, F3-20, F3-30, F3-34)"
type = "protected"
protected_modules = ["apps.inventory.warehouses", "apps.inventory.stock", "apps.inventory.imports", "apps.inventory.reservations", "apps.inventory.transfers"]
allowed_importers = ["apps.inventory.api", "apps.inventory.imports", "apps.inventory.reservations", "apps.inventory.tasks", "apps.inventory.transfers"]  # usan `stock`

[[tool.importlinter.contracts]]
name = "Comandos de precios: solo su API los importa (F3-40, F3-40b, F3-42, F3-48c, F3-49)"
type = "protected"
protected_modules = [
    "apps.pricing.price_lists",
    "apps.pricing.prices",
    "apps.pricing.promotions",
    "apps.pricing.batches",
]
allowed_importers = ["apps.pricing.api"]

[[tool.importlinter.contracts]]
name = "CostService: solo la vista de costos de su API importa apps.pricing.costs (F3-46, ADR-006 §1)"
type = "protected"
protected_modules = ["apps.pricing.costs"]
allowed_importers = ["apps.pricing.api", "apps.pricing.floor"]  # F5-09b2: el suelo de un precio

[[tool.importlinter.contracts]]
name = "pricing-authority: fuera de apps.pricing nadie lee sus modelos; se pregunta a services (ADR-006 §2, F3-43)"
type = "protected"
protected_modules = ["apps.pricing.models", "apps.pricing.selectors"]
allowed_importers = ["apps.pricing"]

[[tool.importlinter.contracts]]
name = "El motor de precios solo lee: apps.pricing.services no importa sus comandos (F3-43)"
type = "forbidden"
source_modules = ["apps.pricing.services"]
forbidden_modules = [
    "apps.pricing.prices",
    "apps.pricing.price_lists",
    "apps.pricing.promotions",
    "apps.pricing.batches",
]

[[tool.importlinter.contracts]]
name = "El motor de precios no lee costos: ni services ni selectors importan costs; tampoco la edición masiva ni sus rutas (F3-46, F3-49, F3-49b, ADR-006 §2)"
type = "forbidden"
source_modules = [
    "apps.pricing.services",
    "apps.pricing.selectors",
    "apps.pricing.batches",
    "apps.pricing.api.batches",
]
forbidden_modules = ["apps.pricing.costs"]

[[tool.importlinter.contracts]]
name = "Comandos de contactos: solo su API los importa (F4-01, F4-11, F7-04, F7-08b)"
type = "protected"
protected_modules = [
    "apps.contacts.commands",
    "apps.contacts.consents",
    "apps.contacts.keywords",
    "apps.contacts.notes",
    "apps.contacts.tags",
]
allowed_importers = [
    "apps.contacts.api",
    "apps.conversations.inbound",  # F7-04: crea el contacto
    "apps.conversations.profiles",  # F7b-04c: el nombre del cliente de Instagram
]

[[tool.importlinter.contracts]]
name = "Comandos de pipelines y oportunidades: solo su API los importa (F5-01, F5-03b, F5-03c)"
type = "protected"
protected_modules = ["apps.deals.commands", "apps.deals.opportunities", "apps.deals.opportunity_stages"]
# las de oportunidades usan los validadores de los de pipelines, y las de etapa, los de crear;
# F5-09c3: aceptar una cotización mueve su oportunidad (con el alcance de quien acepta)
allowed_importers = ["apps.deals.api", "apps.deals.opportunities", "apps.deals.opportunity_stages", "apps.quotes.answers"]

[[tool.importlinter.contracts]]
name = "Entrantes y estados de WhatsApp: solo el procesador los importa (F7-04a, F7-06a; actor de sistema)"
type = "protected"
protected_modules = ["apps.conversations.inbound", "apps.conversations.delivery"]
# `delivery` usa el instante creíble de `inbound` (`inbound.instant`)
allowed_importers = ["apps.conversations.ingress", "apps.conversations.delivery"]

[[tool.importlinter.contracts]]
name = "Comandos de cotizaciones: solo su API los importa (F5-09a)"
type = "protected"
protected_modules = [
    "apps.quotes.commands", "apps.quotes.discounts", "apps.quotes.decisions", "apps.quotes.lifecycle",
]
allowed_importers = [
    "apps.quotes.api", "apps.quotes.discounts", "apps.quotes.decisions", "apps.quotes.lifecycle",
    "apps.quotes.answers",
]

[[tool.importlinter.contracts]]
name = "Respuestas de cotizaciones: solo su API y su tarea de vencimiento (F5-09c3)"
type = "protected"
protected_modules = ["apps.quotes.answers"]
allowed_importers = ["apps.quotes.api", "apps.quotes.tasks"]

[[tool.importlinter.contracts]]
name = "Políticas de descuento: solo su API importa apps.quotes.policies (F5-09b4)"
type = "protected"
protected_modules = ["apps.quotes.policies"]
allowed_importers = ["apps.quotes.api"]

[[tool.importlinter.contracts]]
name = "Comandos de tareas: solo su API los importa (F5-08a)"
type = "protected"
protected_modules = ["apps.tasks.commands"]
allowed_importers = ["apps.tasks.api"]

[[tool.importlinter.contracts]]
name = "Comandos del Inbox: solo su API y sus tareas los importan (F6-01c, F6-04b, F6-08a1, F7-02b, F7-02c, F7-04)"
type = "protected"
protected_modules = [
    "apps.conversations.commands",
    "apps.conversations.credentials",
    "apps.conversations.accounts",
    "apps.conversations.quick_replies",
]
allowed_importers = [
    "apps.conversations.api",
    "apps.conversations.tasks",
    "apps.conversations.accounts",  # F7-02c: usa `credentials`
    "apps.conversations.inbound",  # F7-04: `record_inbound`
    "apps.conversations.delivery",  # F7-06a: `advance_delivery` y el estado de la cuenta
    "apps.conversations.whatsapp",  # F7-05b: `credentials.open_token`
    "apps.conversations.media",  # F7-09a1c: `credentials.open_token`
]

[[tool.importlinter.contracts]]
name = "Comandos de sucursales: solo la API de organizations los importa (F2-44)"
type = "protected"
protected_modules = ["apps.organizations.branches"]
allowed_importers = ["apps.organizations.api"]

[[tool.importlinter.contracts]]
name = "Comandos de equipos: solo los importan la API de organizations y members (F2-53, D-F2-13)"
type = "protected"
protected_modules = ["apps.organizations.teams"]
allowed_importers = ["apps.organizations.api", "apps.members"]

[[tool.importlinter.contracts]]
name = "provisioning y members no tocan los modelos de otros módulos (module-dependencies §3)"
type = "forbidden"
source_modules = ["apps.provisioning", "apps.members"]
forbidden_modules = ["apps.access.models", "apps.accounts.models", "apps.organizations.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "sentry_sdk solo dentro de core.observability (module-dependencies §5)"
type = "protected"
protected_modules = ["sentry_sdk"]
allowed_importers = ["core.observability"]

[[tool.importlinter.contracts]]
name = "boto3/botocore solo dentro de core.storage (ADR-008)"
type = "protected"
protected_modules = ["boto3", "botocore"]
allowed_importers = ["core.storage"]

[[tool.importlinter.contracts]]
name = "HTTP saliente solo vía core.http (allowlist anti-SSRF)"
type = "protected"
protected_modules = ["urllib3"]  # requests/httpx/urllib.request/http.client: tests/test_http.py
allowed_importers = ["core.http"]

[[tool.importlinter.contracts]]
name = "cryptography solo dentro de core.sealed (ADR-022 §1)"
type = "protected"
protected_modules = ["cryptography"]
allowed_importers = ["core.sealed"]

[[tool.importlinter.contracts]]
name = "openpyxl solo dentro de apps.imports.xlsxfile, tras sus topes (ADR-012 §4.3)"
type = "protected"
protected_modules = ["openpyxl"]
allowed_importers = ["apps.imports.xlsxfile"]
