[project]
name = "crm-backend"
version = "0.1.0"
description = "Good Doggy CRM backend (Django, ASGI)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "boto3==1.43.105",
    "celery==5.6.3",
    "channels==4.3.2",
    "django==5.2.17",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "sentry-sdk==2.69.1",
    "structlog==26.1.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "django-stubs==5.2.9",
    "django-stubs-ext==5.2.9",
    "import-linter==2.15",
    "mypy==1.19.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.9",
]

[tool.uv]
required-version = "==0.12.19"
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, S seguridad (bandit), DJ django
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert en tests

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]  # sin py.typed (F1-04); types-channels exige django-stubs 6
module = [
    "celery.*", "kombu.*", "channels.*", "boto3.*", "botocore.*", "rest_framework.*",
    "drf_spectacular.*",
]
follow_imports = "skip"  # tipos Any: sin stubs compatibles
ignore_missing_imports = true

[[tool.mypy.overrides]]  # rest_framework es Any (arriba): solo aquí se subclasifica DRF
module = [
    "apps.access.permissions", "core.api.authentication", "core.api.errors",
    "core.api.permissions", "tests.test_access_api", "tests.test_api_conventions",
    "core.api.pagination", "tests.test_pagination",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]  # vistas y serializadores de DRF: clases y decoradores sin tipos
module = ["apps.*.api.*", "core.api.parsers", "tests.test_auth_api"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]  # asgiref.testing sin anotaciones
module = ["tests.test_entrypoints"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# ADR-012 §3: deprecaciones como error desde el inicio (facilita el salto a Django 6.2 LTS).
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.importlinter]
root_packages = ["config", "core", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core (kernel) no depende de config ni de apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["config", "apps"]

[[tool.importlinter.contracts]]
name = "Capas (module-dependencies §1): provisioning > organizations | access | accounts (L2) > audit | files (L1) > core (L0)"
type = "layers"
layers = [
    "apps.provisioning",  # orquesta el alta: el único que une los tres módulos de L2 (F2-06)
    "apps.organizations | apps.access | apps.accounts",
    "apps.audit | apps.files",
    "core",
]

[[tool.importlinter.contracts]]
name = "Fronteras de alta: solo provisioning importa los bootstrap.py de L2 (F2-06)"
type = "protected"
protected_modules = ["apps.access.bootstrap", "apps.accounts.bootstrap", "apps.organizations.bootstrap"]
allowed_importers = ["apps.provisioning"]

[[tool.importlinter.contracts]]
name = "provisioning no toca los modelos de otros módulos (module-dependencies §3)"
type = "forbidden"
source_modules = ["apps.provisioning"]
forbidden_modules = ["apps.access.models", "apps.accounts.models", "apps.organizations.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "sentry_sdk solo dentro de core.observability (module-dependencies §5)"
type = "protected"
protected_modules = ["sentry_sdk"]
allowed_importers = ["core.observability"]

[[tool.importlinter.contracts]]
name = "boto3/botocore solo dentro de core.storage (ADR-008)"
type = "protected"
protected_modules = ["boto3", "botocore"]
allowed_importers = ["core.storage"]

[[tool.importlinter.contracts]]
name = "HTTP saliente solo vía core.http (allowlist anti-SSRF)"
type = "protected"
protected_modules = ["urllib3"]  # requests/httpx/urllib.request/http.client: tests/test_http.py
allowed_importers = ["core.http"]
