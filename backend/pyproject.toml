[project]
name = "crm-backend"
version = "0.1.0"
description = "Good Doggy CRM backend (Django, ASGI)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "boto3==1.43.105",
    "celery==5.6.3",
    "channels==4.3.2",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "django==5.2.17",
    "djangorestframework==3.18.2",
    "drf-spectacular==0.30.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "sentry-sdk==2.69.1",
    "structlog==26.1.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "django-stubs==5.2.9",
    "django-stubs-ext==5.2.9",
    "import-linter==2.15",
    "mypy==1.19.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.9",
]

[tool.uv]
required-version = "==0.12.19"
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, S seguridad (bandit), DJ django
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert en tests

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]  # sin py.typed (F1-04); types-channels exige django-stubs 6
module = [
    "celery.*", "kombu.*", "channels.*", "boto3.*", "botocore.*", "rest_framework.*",
    "drf_spectacular.*", "openpyxl.*",
]
follow_imports = "skip"  # tipos Any: sin stubs compatibles
ignore_missing_imports = true

[[tool.mypy.overrides]]  # rest_framework es Any (arriba): solo aquí se subclasifica DRF
module = [
    "apps.access.permissions", "core.api.authentication", "core.api.errors",
    "core.api.permissions", "tests.test_access_api", "tests.test_api_conventions",
    "core.api.pagination", "tests.test_pagination",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]  # vistas y serializadores de DRF: clases y decoradores sin tipos
module = ["apps.*.api.*", "core.api.parsers", "tests.test_auth_api"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]  # asgiref.testing sin anotaciones
module = ["tests.test_entrypoints"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# ADR-012 §3: deprecaciones como error desde el inicio (facilita el salto a Django 6.2 LTS).
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.importlinter]
root_packages = ["config", "core", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core (kernel) no depende de config ni de apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["config", "apps"]

[[tool.importlinter.contracts]]
name = "Capas (module-dependencies §1): inventory > catalog | contacts (L3) > provisioning | members (L2+) > organizations | access | accounts (L2) > audit | files | imports (L1) > core (L0)"
type = "layers"
layers = [
    # L3: dominio de negocio (module-dependencies §1). inventory depende de catalog (§2): almacenes
    # y stock (Fase 3). catalog, el catálogo (Fase 3); contacts, los clientes (Fase 4):
    # independientes entre sí, no se importan.
    "apps.inventory",
    "apps.catalog | apps.contacts",
    # L2+: unen módulos de L2. provisioning, el alta (F2-06); members, sus miembros (ADR-017)
    "apps.provisioning | apps.members",
    "apps.organizations | apps.access | apps.accounts",
    # imports: las tablas genéricas de importación y los lectores CSV y XLSX; cada módulo valida
    # y aplica las suyas
    "apps.audit | apps.files | apps.imports",
    "core",
]

[[tool.importlinter.contracts]]
name = "Fronteras de alta: solo provisioning importa los bootstrap.py de L2 (F2-06)"
type = "protected"
protected_modules = ["apps.access.bootstrap", "apps.accounts.bootstrap", "apps.organizations.bootstrap"]
allowed_importers = ["apps.provisioning"]

[[tool.importlinter.contracts]]
name = "Membresías e invitaciones: solo members llama a organizations.services (ADR-017)"
type = "protected"
protected_modules = ["apps.organizations.services"]
allowed_importers = ["apps.members"]

[[tool.importlinter.contracts]]
name = "Comandos del catálogo: solo su API los importa (F3-01, F3-04)"
type = "protected"
protected_modules = ["apps.catalog.brands", "apps.catalog.categories", "apps.catalog.products"]
allowed_importers = ["apps.catalog.api"]

[[tool.importlinter.contracts]]
name = "Comandos del inventario: solo su API los importa (F3-08, F3-09, F3-20)"
type = "protected"
protected_modules = ["apps.inventory.warehouses", "apps.inventory.stock", "apps.inventory.imports"]
allowed_importers = ["apps.inventory.api", "apps.inventory.imports"]  # la importación usa `stock`

[[tool.importlinter.contracts]]
name = "Comandos de contactos: solo su API los importa (F4-01)"
type = "protected"
protected_modules = ["apps.contacts.commands", "apps.contacts.notes"]
allowed_importers = ["apps.contacts.api"]

[[tool.importlinter.contracts]]
name = "Comandos de sucursales: solo la API de organizations los importa (F2-44)"
type = "protected"
protected_modules = ["apps.organizations.branches"]
allowed_importers = ["apps.organizations.api"]

[[tool.importlinter.contracts]]
name = "Comandos de equipos: solo los importan la API de organizations y members (F2-53, D-F2-13)"
type = "protected"
protected_modules = ["apps.organizations.teams"]
allowed_importers = ["apps.organizations.api", "apps.members"]

[[tool.importlinter.contracts]]
name = "provisioning y members no tocan los modelos de otros módulos (module-dependencies §3)"
type = "forbidden"
source_modules = ["apps.provisioning", "apps.members"]
forbidden_modules = ["apps.access.models", "apps.accounts.models", "apps.organizations.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "sentry_sdk solo dentro de core.observability (module-dependencies §5)"
type = "protected"
protected_modules = ["sentry_sdk"]
allowed_importers = ["core.observability"]

[[tool.importlinter.contracts]]
name = "boto3/botocore solo dentro de core.storage (ADR-008)"
type = "protected"
protected_modules = ["boto3", "botocore"]
allowed_importers = ["core.storage"]

[[tool.importlinter.contracts]]
name = "HTTP saliente solo vía core.http (allowlist anti-SSRF)"
type = "protected"
protected_modules = ["urllib3"]  # requests/httpx/urllib.request/http.client: tests/test_http.py
allowed_importers = ["core.http"]

[[tool.importlinter.contracts]]
name = "cryptography solo dentro de core.sealed (ADR-022 §1)"
type = "protected"
protected_modules = ["cryptography"]
allowed_importers = ["core.sealed"]

[[tool.importlinter.contracts]]
name = "openpyxl solo dentro de apps.imports.xlsxfile, tras sus topes (ADR-012 §4.3)"
type = "protected"
protected_modules = ["openpyxl"]
allowed_importers = ["apps.imports.xlsxfile"]
